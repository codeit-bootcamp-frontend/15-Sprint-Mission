<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="일상의 모든 물건을 거래해보세요" />
    <meta name="keywords" content="중고거래, 판다마켓, 중고마켓, 일상 거래" />
    <meta name="author" content="sgoldenbird" />
    <link
      rel="canonical"
      href="https://codeit-sprint15-mission.netlify.app/auth/singup"
    />
    <meta name="robots" content="index, follow" />
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="판다 마켓 회원가입" />
    <meta property="og:description" content="일상의 모든 물건을 거래해보세요" />
    <meta
      property="og:image"
      content="https://codeit-sprint15-mission.netlify.app/images/panda_pink.jpg"
    />
    <meta
      property="og:url"
      content="https://codeit-sprint15-mission.netlify.app/auth/signup"
    />
    <meta property="og:type" content="website" />
    <meta property="fb:app_id" content="3666415323503290" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="판다 마켓 회원가입" />
    <meta
      name="twitter:description"
      content="일상의 모든 물건을 거래해보세요"
    />
    <meta
      name="twitter:image"
      content="https://codeit-sprint15-mission.netlify.app/images/panda_pink.jpg"
    />
    <meta
      name="twitter:url"
      content="https://codeit-sprint15-mission.netlify.app/auth/signup"
    />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="icon" href="/images/panda_face.svg" type="image/svg" />
    <link rel="stylesheet" href="../index.css" />
    <title>회원가입 | 판다마켓 - 일상의 모든 중고 거래</title>
    <script type="module" src="./auth-validation.js"></script>
  </head>
  <body class="auth-body">
    <div class="auth-container">
      <header class="auth-header">
        <h1 class="logo-container">
          <a href="/">
            <img src="../images/panda_face.svg" alt="logo" class="logo" />
            <img
              src="../images/logo_typo.svg"
              alt="panda market"
              class="logo-typo"
            />
          </a>
        </h1>
      </header>

      <form class="auth-form" data-auth-type="signup" method="post">
        <div class="input-container">
          <label for="email">이메일</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="이메일을 입력해주세요"
          />
          <div class="validation-error-message"></div>
        </div>

        <div class="input-container">
          <label for="nickname">닉네임</label>
          <input
            type="text"
            id="nickname"
            name="nickname"
            placeholder="닉네임을 입력해주세요"
          />
          <div class="validation-error-message"></div>
        </div>

        <div class="input-container">
          <label for="password">비밀번호</label>
          <div class="password-input">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="비밀번호를 입력해주세요"
            />
            <button
              class="password-visibility eye-closed"
              id="password-visibility"
              type="button"
              aria-label="비밀번호 숨기기"
            ></button>
          </div>
          <div class="validation-error-message"></div>
        </div>

        <div class="input-container">
          <label for="password-confirm">비밀번호 확인</label>
          <div class="password-input">
            <input
              type="password"
              id="password-confirm"
              name="password-confirm"
              placeholder="비밀번호를 다시 한번 입력해주세요"
            />
            <button
              class="password-visibility eye-closed"
              id="password-confirm-visibility"
              type="button"
              aria-label="비밀번호 확인 보이기"
            ></button>
          </div>
          <div class="validation-error-message"></div>
        </div>

        <button type="submit" class="auth-button" disabled>회원가입</button>
      </form>

      <div class="oauth-container">
        <p>간편 로그인하기</p>
        <ul class="oauth-site">
          <li>
            <a href="https://www.google.com" class="oauth-button">
              <img src="../images/google_logo.svg" alt="google signin button" />
            </a>
          </li>
          <li>
            <a href="https://www.kakaocorp.com" class="oauth-button">
              <img src="../images/kakao_logo.svg" alt="kakao signin button" />
            </a>
          </li>
        </ul>
      </div>

      <div class="switch">
        이미 회원이신가요?&nbsp;
        <a href="signin.html" class="switch-button">로그인</a>
      </div>
    </div>
  </body>
</html>
