<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="icon" href="/images/panda_face.svg" type="image/svg" />
    <link rel="stylesheet" href="../index.css" />
    <title>판다마켓 로그인</title>
  </head>
  <body class="auth-body">
    <div class="auth-container">
      <header class="auth-header">
        <h1 class="logo-container">
          <a href="/">
            <img src="../images/panda_face.svg" alt="logo" class="logo" />
            판다마켓
          </a>
        </h1>
      </header>

      <form class="auth-form" method="POST">
        <div class="input-container">
          <label for="email">이메일</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="이메일을 입력해주세요"
          />
        </div>
        <div class="input-container">
          <label for="password">비밀번호</label>
          <div class="password-input">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="비밀번호를 입력해주세요"
            />
            <button class="password-visibility" type="button">
              <img
                src="../images/close_eye_grey.svg"
                alt="closed eye icon"
                class="close-eye"
              />
            </button>
          </div>
        </div>

        <button type="submit" class="auth-button">로그인</button>
      </form>

      <div class="oauth-container">
        <p>간편 로그인하기</p>
        <ul class="oauth-site">
          <li>
            <a href="https://www.google.com" class="oauth-button">
              <img src="../images/google_logo.svg" alt="google login button" />
            </a>
          </li>
          <li>
            <a href="https://www.kakaocorp.com" class="oauth-button">
              <img src="../images/kakao_logo.svg" alt="kakao login button" />
            </a>
          </li>
        </ul>
      </div>

      <div class="switch">
        판다마켓이 처음이신가요?&nbsp;
        <a href="signup.html" class="switch-button">회원가입</a>
      </div>
    </div>
  </body>
</html>
