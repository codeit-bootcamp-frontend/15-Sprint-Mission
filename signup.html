<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>판다마켓-회원가입</title>
        <link rel="stylesheet" href="reset.css" />
        <link rel="stylesheet" href="auth.css" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="container">
            <div class="logo-wrap">
                <a href="/"> <img src="images/logo.png" alt="판다마켓 로고" class="logo2" /></a>
            </div>
            <form method="post">
                <div class="form-group">
                    <label for="email">이메일</label>
                    <div><input type="email" id="email" name="email" placeholder="이메일을 입력해 주세요" /></div>
                </div>
                <div class="form-group">
                    <label for="text">닉네임</label>
                    <div><input type="text" id="nickname" name="nickname" placeholder="닉네임을 입력해 주세요" /></div>
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <div class="password-wrap">
                        <input type="password" id="password" name="password" placeholder="비밀번호를 입력해 주세요" />
                        <button class="password-button" type="button"><img src="images/unvisible_eye.png" /></button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">비밀번호 확인</label>
                    <div class="password-wrap">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="비밀번호를 다시 한 번 입력해 주세요" />
                        <button class="password-button" type="button"><img src="images/unvisible_eye.png" /></button>
                    </div>
                    <button class="login-button" type="submit">회원가입</button>
                </div>
            </form>
            <div class="login-method-container">
                <h3 class="social-login-button">간편 로그인하기</h3>
                <div class="login-method-wrap">
                    <a href="https://www.google.com/">
                        <img src="images/google_logo.png" alt="구글 로그인" width="42" />
                    </a>
                    <a href="https://www.kakaocorp.com/page/">
                        <img src="images/kakao_logo.png" alt="카카오 로그인" width="42" />
                    </a>
                </div>
            </div>
            <div class="signup-go">이미 회원이신가요?<a href="login.html">로그인</a></div>
        </main>
    </body>
</html>
