<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" href="./signup.css">
    <title>Document</title>
</head>
<body>
    <container>
        <div id="logo">
            <a href="index.html">
                <img src="./image/판다얼굴.png" alt="판다마켓 로고">
                <img src="./image/판다마켓.png" alt="판다마켓">
            </a>
        </div>
        <form>
            <lable>이메일</lable>
            <input type="email" name="user-email" placeholder="이메일을 입력해주세요">
            <lable>닉네임</lable>
            <input type="text" name="user-nickname" placeholder="닉네임을 입력해주세요">
            <lable>비밀번호</lable>
            <input type="password" name="user-password" placeholder="비밀번호를 입력해주세요">
            <lable>비밀번호 확인</lable>
            <input type="password" name="user-password-check" placeholder="비밀번호를 학인해주세요">
            <div class="sign-up-button">
                회원가입
            </div>
        </form>
        <div class="sns-login">
            <p>간편 로그인하기</p>
            <div class="sns-login-image">
                <a href="https://www.google.com/">
                    <img src="./image/google_logo.png" alt="구글로그인">
                </a>
                <a href="https://www.kakaocorp.com/page/">
                    <img src="./image/kakao_logo.png" alt="카카오톡 로그인">
                </a>
            </div>
        </div>
        <div class="footer">
            <p>이미 회원이신가요?</p>
            <a href="./login.html">로그인</a>
        </div>
    </container>
</body>
</html>
