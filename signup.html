<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <div class="signup-page">
    <div class="text-para">
     <img src="./images/logo.png" alt=loginimg class="loginimg">
     <form class="loginform">
      <!-- 이메일 적는 곳 시작-->
      <label class="emailform">
        이메일
        <input type="text" name="userEmail" placeholder="codeit@email.com" class="innertext">
      </label>
      <!-- 닉네임 적는 곳-->
      <label class="nickname">
        닉네임
        <input type="text" name="userNickname" placeholder="별명" class="innertext">
      </label>
      <!-- 패스워드 적는 곳 시작-->
      <label class="pswdform">
        비밀번호
        <input type="text" name="userPassword" placeholder="password" class="innertext">
      </label>
      <!-- 비밀번호 확인 -->
      <label class="checkpswd">
        비밀번호 확인
        <input type="text" name="checkPassword" placeholder="password" class="innertext">
      </label>
      <button class="signup-btn">회원가입</button>
     </form>
     <!-- 간편 로그인 칸-->
    <div class="easylogin">
      <span>간편 로그인 하기</span>
      <div class="el-icon">
        <a href="https://www.google.com">
          <img src="./images/Component 2.png">
        </a>
        <a href="https://www.kakaocorp.com/page">
          <img src="./images/Component 3.png">
        </a>
      </div>
    </div>
    <div class="signup">
      이미 회원이신가요?
      <a href="login.html">로그인</a>
    </div>
    </div> 
  </div>
  <script src="signup.js"></script>
</body>
</html>
