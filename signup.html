<!DOCTYPE html>
<html lang="kr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/common/auth.css">
    <link rel="stylesheet" href="/css/common/variables.css">
    <link rel="stylesheet" href="/css/common/reset.css">
    <link rel="stylesheet" href="css/pages/login.css">
    <title>판다마켓 - 회원가입</title>
</head>
<body>
    <main>
        <a href="/">
            <img class="logo" src="/assets/logo/logo.png" alt="판다마켓 로고">
        </a>
        <div class="input_info">
            <form>
                <div class="input_group">
                    <label for="email">이메일</label>
                    <input type="email" name="email">
                </div>
                <div class="input_group">
                    <label for="username">닉네임</label>
                    <input type="username" name="username">
                </div>
                <div class="input_group">
                    <label for="password">비밀번호</label>
                    <div class="password">
                        <input id="pwd" type="password" name="password">
                        <img class="pwd_icon" src="/assets/icons/hide-password.png" alt="비밀번호가리기">
                    </div>
                </div>
                <div class="input_group">
                    비밀번호 확인<br>
                    <div class="password">
                        <input id="pwd check" type="text" name="password">
                        <img class="pwd_icon" src="/assets/icons/show-password.png" alt="비밀번호보이기기">
                    </div>
                </div>
                <div class="submit_btn">
                    <button type="submit">회원가입</button>
                </div>
            </form>
            <div class="sign_easy">
                간편 로그인하기
                <div>
                    <a href="https://www.google.com/">
                        <img class="icon" src="/assets/icons/Google.png" alt="간편로그인_구글">
                    </a>
                    <a href="https://www.kakaocorp.com/page/">
                        <img class="icon" src="/assets/icons/Kakao.png" alt="간편로그인_구글">
                    </a>
                </div>
            </div>
            <div class="move_page">
                판다마켓이 처음이신가요?
                <a href="/login.html">회원가입</a>
            </div>
        </div>
    </main>
</body>
</html>
