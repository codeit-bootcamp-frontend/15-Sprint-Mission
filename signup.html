<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/favicon.ico">
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/palette.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <script src="https://kit.fontawesome.com/5b35a6d114.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <title>판다마켓</title>
  </head>
<body>
  <main>
    <div class="logo-auth-box">
      <h1>
        <a href="/">
          <img src="assets/auth_logo.png" alt="판다마켓"/>
        </a>
      </h1>
    </div>
    <div class="cont-area">
      <div class="group-inp">
        <label for="inputEmail">이메일</label>
        <input type="email" id="inputEmail" placeholder="codeit@email.com">
      </div>
      <div class="group-inp">
        <label for="inputNickname">닉네임</label>
        <input type="email" id="inputNickname" placeholder="닉네임을 입력하세요">
      </div>
      <div class="group-inp">
        <label for="inputPwd">비밀번호</label>
        <div class="inputPwd-wrap">
          <input type="password" id="inputPwd" placeholder="비밀번호">
          <i class="fa-regular fa-eye-slash"></i>
        </div>
      </div>
      <div class="group-inp">
        <label for="inputPwd2">비밀번호 확인</label>
        <div class="inputPwd-wrap">
          <input type="password" id="inputPwd2" placeholder="비밀번호 확인">
          <i class="fa-regular fa-eye-slash"></i>
        </div>
      </div>
      <button type="submit" class="btn login-btn">회원가입</button>
      <div class="social-login-wrap">
        <div class="social-login-title">간편 로그인하기</div>
        <ul>
          <li><a href="https://www.google.com">
            <img src="assets/social-google.png" alt="구글로그인" />
          </a></li>
          <li><a href="https://www.kakaocorp.com/page/">
            <img src="assets/social-kakao.png" alt="카카오로그인" />
          </a></li>
        </ul>
      </div>
      <div class="sign-up-link">
        <span>이미 회원이신가요?</span>
        <a href="./login.html">로그인</a>
      </div>
    </div>
  </main>
</body>
</html>
