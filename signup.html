<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 - 판다마켓</title>
    <link rel="icon" href="images/logo/favicon.ico" />

    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>

  <body>
    <div class="auth-container">
      <div class="logo-container">
        <a href="/"><img src="images/logo/logo.png" alt="판다마켓 홈" width="396" /></a>
      </div>

      <form class="auth-form">
        <div class="input-group">
          <label for="email">이메일</label>
          <input id="email" name="email" type="email" placeholder="이메일을 입력해 주세요" required />
        </div>

        <div class="input-group">
          <label for="nickname">닉네임</label>
          <input id="nickname" name="nickname" type="text" placeholder="닉네임을 입력해 주세요" required />
        </div>

        <div class="input-group">
          <label for="password">비밀번호</label>
          <div class="password-wrapper">
            <input id="password" name="password" type="password" placeholder="비밀번호를 입력해 주세요" required />
            <button type="button">
              <img src="images/login_icon/eye-invisible.svg" alt="비밀번호 감추기" class="toggle-password" />
            </button>
          </div>
        </div>

        <div class="input-group">
          <label for="passwordCheck">비밀번호 확인</label>
          <div class="password-wrapper">
            <input
              id="passwordCheck"
              name="passwordCheck"
              type="password"
              placeholder="비밀번호를 다시 입력해 주세요"
              required />
            <button type="button">
              <img src="images/login_icon/eye-invisible.svg" alt="비밀번호 감추기" class="toggle-password" />
            </button>
          </div>
        </div>

        <button type="submit" class="auth-button">회원가입</button>
      </form>

      <div class="social-login">
        <h3>간편 로그인하기</h3>
        <div class="social-icons">
          <a href="https://www.google.com/" target="_blank">
            <img src="images/socialIcon/google-logo.png" alt="구글 로그인" width="42" />
          </a>
          <a href="https://www.kakaocorp.com/page/" target="_blank">
            <img src="images/socialIcon/kakao-logo.png" alt="카카오톡 로그인" width="42" />
          </a>
        </div>
      </div>

      <div class="auth-footer">
        이미 계정이 있으신가요?
        <a href="login.html">로그인</a>
      </div>
    </div>

    <script src="scripts/auth.js"></script>
  </body>
</html>
