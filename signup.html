<!DOCTYPE html>
<html lang="kr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/common/auth.css">
    <link rel="stylesheet" href="/css/common/variables.css">
    <link rel="stylesheet" href="/css/common/reset.css">
    <link rel="stylesheet" href="/css/pages/signup.css">
    <title>판다마켓 - 회원가입</title>
</head>
<body>
    <main>
        <a href="/" class="logo-a">
            <img class="logo" src="/assets/logo/logo.png" alt="판다마켓 로고">
        </a>
        <div class="input-info">
            <form>
                <div class="input-group">
                    <label for="email">이메일</label>
                    <input type="email" name="email" placeholder="이메일을 입력해주세요" class="auth-input">
                </div>
                <div class="input-group">
                    <label for="username">닉네임</label>
                    <input type="username" name="username" placeholder="닉네임을 입력해주세요" class="auth-input">
                </div>
                <div class="input-group">
                    <label for="password">비밀번호</label>
                    <div class="password">
                        <input id="pwd" type="password" name="password" placeholder="비밀번호를 입력해주세요" class="auth-input">
                        <button type="button" class="pwd-icon-btn">
                            <img class="pwd-icon" src="/assets/icons/hide-password.png" alt="비밀번호 가리기">
                        </button>
                    </div>
                </div>
                <div class="input-group">
                    <label for="password">비밀번호 확인</label>
                    <div class="password">
                        <input id="pwd check" type="text" name="password" placeholder="비밀번호를 다시 한 번 입력해주세요" class="auth-input">
                        <button  type="button" class="pwd-icon-btn">
                            <img class="pwd-icon" src="/assets/icons/show-password.png" alt="비밀번호 보이기">
                        </button>
                    </div>
                </div>
                <div class="submit-btn">
                    <button type="submit">회원가입</button>
                </div>
            </form>
            <div class="sign-easy">
                간편 로그인하기
                <div>
                    <a href="https://www.google.com/">
                        <img class="icon" src="/assets/icons/Google.png" alt="간편로그인 구글">
                    </a>
                    <a href="https://www.kakaocorp.com/page/">
                        <img class="icon" src="/assets/icons/Kakao.png" alt="간편로그인 카카오">
                    </a>
                </div>
            </div>
            <div class="move-page">
                이미 회원이신가요?
                <a href="/login.html">로그인</a>
            </div>
        </div>
    </main>
</body>
</html>
