<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" href="./login-Signup.css">
    <title>판다마켓 - 회원가입</title>
</head>
<body>
    <container>
        <div id="logo">
            <a href="index.html">
                <div class="logo-image">
                    <img src="./image/logo.png" alt="판다마켓 로고">
                </div>  
                <div class="logo-text">    
                    <img src="./image/typography.png" alt="판다마켓 로고 텍스트">
                </div>
                </a>
        </div>
        <form>
            <div class="email-field">
                <label for="email">이메일</label>
                <input type="email" id="email" name="user-email" placeholder="이메일을 입력해주세요">
                <div class="error-message"></div>
            </div>
            <div class="nickname-field">
                <label for="nickname">닉네임</label>
                <input type="text" id="nickname" name="user-nickname" placeholder="닉네임을 입력해주세요">
                <div class="error-message"></div>
            </div>    
            <div class="password-field">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="user-password" placeholder="비밀번호를 입력해주세요">
                <div class="error-message"></div>
            </div>    
            <div class="passwordCheck-field">
                <label for="passwordCheck">비밀번호 확인</label>
                <input type="password" id="passwordCheck" name="user-password-check" placeholder="비밀번호를 학인주세요">
                <div class="error-message"></div>
            </div> 
            <button type="button" class="sign-up-button buttons" onclick="location.href='./login.html'" disabled>
                회원가입
            </button>
        </form>
        <div class="sns-login">
            <p>간편 로그인하기</p>
            <div class="sns-login-image">
                <a href="https://www.google.com/">
                    <img src="./image/google_logo.png" alt="구글로그인">
                </a>
                <a href="https://www.kakaocorp.com/page/">
                    <img src="./image/kakao_logo.png" alt="카카오톡 로그인">
                </a>
            </div>
        </div>
        <div class="footer">
            <p>이미 회원이신가요?</p>
            <a href="./login.html">로그인</a>
        </div>
    </container>
    <script src="signup.js"></script>
</body>
</html>
