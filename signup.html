<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 - 회원가입</title>
    <link rel="icon" href="./assets/favicon.ico" type="image/x-icon" />

    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

    <link rel="stylesheet" href="./styles/auth_index.css" />
  </head>
  <body>
    <div class="auth__container">
      <a href="/" class="auth__logo">
        <img src="./assets/logos/logo_lg.png" alt="판다마켓 로고" />
      </a>

      <form>
        <div class="auth__input">
          <label for="email">이메일</label>
          <input id="email" name="email" type="email" placeholder="이메일을 입력해 주세요" />
        </div>

        <div class="auth__input">
          <label for="nickname">닉네임</label>
          <input id="nickname" name="nickname" type="text" placeholder="닉네임을 입력해 주세요" />
        </div>

        <div class="auth__input">
          <label for="password">비밀번호</label>
          <div class="input__wrapper">
            <input id="password" name="password" type="password" placeholder="비밀번호를 입력해 주세요" />
            <button type="button" class="toggle-show-password">
              <img src="./assets/icons/icon_invisible_eye.svg" alt="비밀번호 숨김" class="show-password-icon" />
            </button>
          </div>
        </div>

        <div class="auth__input">
          <label for="password-confirm">비밀번호 확인</label>
          <div class="input__wrapper">
            <input
              id="password-confirm"
              name="password-confirm"
              type="password"
              placeholder="비밀번호를 한 번 더 입력해주세요" />
            <button type="button" class="toggle-show-password">
              <img src="./assets/icons/icon_invisible_eye.svg" alt="비밀번호 숨김" class="show-password-icon" />
            </button>
          </div>
        </div>

        <button class="auth__button" type="submit">회원가입</button>
      </form>

      <div class="auth__social">
        <p class="social__title">간편 로그인하기</p>

        <ul class="social__buttons">
          <li>
            <a href="https://www.google.com/" target="_blank">
              <img src="./assets/icons/icon_google.svg" alt="구글 로그인" />
            </a>
          </li>
          <li>
            <a href="https://www.kakaocorp.com/page/" target="_blank">
              <img src="./assets/icons/icon_kakaotalk.svg" alt="카카오톡 로그인" />
            </a>
          </li>
        </ul>
      </div>

      <div class="auth__switch">
        <p>이미 회원이신가요?</p>
        <a href="/login.html">로그인</a>
      </div>
    </div>

    <div class="unsupported-screen">
      <div class="unsupported-message">
        현재 기기에서는 지원하지 않습니다.<br />
        375px 이상의 화면에서 이용해 주세요.
      </div>
    </div>
  </body>
</html>
