<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>

    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/login.css" />
  </head>
  <body>
    <main>
      <header>
        <a href="./index.html">
          <img src="./img/logo.png" alt="판다마켓 로고" />
        </a>
      </header>
      <form>
        <label for="email">이메일 </label>
        <input type="email" id="email" name="email" />
        <label for="nickname" class="nickname_label">닉네임</label>
        <input type="text" id="nickname" name="nickname" />
        <div class="pw_area">
          <label for="password">비밀번호</label>
          <div class="visible_icon"></div>
          <input type="password" name="password" id="password" />
        </div>
        <div class="pw_area">
          <label for="password_check">비밀번호 확인</label>
          <div class="visible_icon"></div>
          <input type="password" name="password_check" id="password_check" />
        </div>
        <button href="" class="primary_btn">회원가입</button>
      </form>
      <section>
        <div class="sns_login">
          <span>간편 로그인하기</span>
          <ul>
            <li>
              <a href="https://www.google.com/"
                ><img
                  class="sns_icon"
                  src="./img/google_icon.png"
                  alt="구글로그인"
              /></a>
            </li>
            <li>
              <a href="https://www.kakaocorp.com/page/"
                ><img
                  class="sns_icon"
                  src="./img/kakaotalk_icon.png"
                  alt="카카오로그인"
              /></a>
            </li>
          </ul>
        </div>
        <p class="go_joinpage">
          이미 회원이신가요? <a href="./login.html">로그인</a>
        </p>
      </section>
    </main>
  </body>
</html>
