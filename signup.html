<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 회원가입</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="utility.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <header>
      <div class="logo wrap">
        <a href="/">
          <img src="images/logo_lg.png" alt="판다마켓" />
        </a>
      </div>
    </header>
    <main>
      <div class="wrap">
        <form class="signup-form">
          <div class="input-group">
            <label for="useremail" class="bold">이메일</label>
            <input
              type="email"
              id="useremail"
              class="text-lg regular"
              placeholder="이메일을 입력해주세요"
            />
          </div>
          <div class="input-group">
            <label for="nickname" class="bold">닉네임</label>
            <input
              type="text"
              id="nickname"
              class="text-lg regular"
              placeholder="닉네임을 입력해주세요"
            />
          </div>
          <div class="input-group">
            <button type="button">
              <img src="images/ic_visibility_off.png" alt="눈감음" />
            </button>
            <label for="password" class="bold">비밀번호</label>
            <input
              type="password"
              id="password"
              class="text-lg regular"
              placeholder="비밀번호를 입력해주세요"
            />
          </div>
          <div class="input-group">
            <button type="button">
              <img src="images/ic_visibility_on.png" alt="눈뜸" />
            </button>
            <label for="passwordCheck" class="bold">비밀번호 확인</label>
            <input
              type="text"
              id="passwordCheck"
              class="text-lg regular"
              placeholder="비밀번호를 다시 한 번 입력해주세요"
            />
          </div>
          <button class="btn-large text-xl semibold" type="submit">
            회원가입
          </button>
        </form>
        <div class="simple-login">
          <span class="text-lg medium">간편 로그인하기</span>
          <ul>
            <li>
              <a href="https://www.google.com/">
                <img src="images/ic_google.png" alt="구글" />
              </a>
            </li>
            <li>
              <a href="https://www.kakaocorp.com/page/">
                <img src="images/ic_kakao.png" alt="카카오톡" />
              </a>
            </li>
          </ul>
        </div>
        <div class="to-login">
          <span>이미 회원이신가요?</span>
          <a href="/login.html">로그인</a>
        </div>
      </div>
    </main>
    <script src="./auth.js"></script>
  </body>
</html>
