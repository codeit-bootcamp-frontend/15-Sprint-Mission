<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/signup.css" />
    <script src="scripts/auth.js" defer></script>
        <link rel="stylesheet" href="styles/auth.css" />
    <title>panda-signup</title>
  </head>
  <body>
    <div class="logo_box">
        <a href="/"
        ><img class="logo" src="images/login/logo.png" alt="판다마켓"
        /></a>
        <form>
            <div class="login_box">
            <div id="imformation">
                <span class="imformation">이메일</span>
                <input class="email_input"></h2>
            </div>
            <div id="imformation">
                <span class="imformation">닉네임</span>
                <input class="nickname_input"></h2>
            </div>
            <div id="imformation">
                <span class="imformation">비밀번호</span>
                <input class="password_input"></h2>
            </div>
            <div id="imformation">
                <span class="imformation">비밀번호 확인</span>
                <input class="password_check_input"></h2>
            </div>
                <button type="submit" class="signup_button">회원가입</button>
            </div>
        </form>
        <div id="easy_login">
          <div class="easy_login_box">
            <h3 class="easy_login">간편 로그인하기</h3>
            <div class="login_sns">
              <a href="https://www.google.com/" target="_blank">
                <img class="login_google" src="images/login/google.png" />
              </a>
              <a href="https://www.kakaocorp.com/page/" target="_blank">
                <img class="login_kakao" src="images/login/kakao.png" />
              </a>
            </div>
          </div>
        </div>
        <div class="signup">
          <p class="login_ask">이미 회원이신가요?</p>
          <a class="login_link" href="login.html">로그인</a>
        </div>
      </div>
    </div>
  </body>
</html>
