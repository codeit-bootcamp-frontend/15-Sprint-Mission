<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>판다마켓</title>
		<link rel="stylesheet" href="reset.css" />
		<link rel="stylesheet" href="common.css" />
		<link rel="stylesheet" href="auth.css" />
		<link
			rel="stylesheet"
			as="style"
			crossorigin
			href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
	</head>
	<body>
		<main class="userForm_main">
			<a href="/">
				<img src="./image/logo.png" alt="판다마켓 로고" class="user_form_logo" />
			</a>
			<form action="#" class="user_form">
				<label for="email">이메일</label>
				<div class="input_container">
					<input type="email" id="email" name="email" placeholder="이메일을 입력해주세요" />
					<p class="email_alert"></p>
				</div>
				<label for="nickname">닉네임</label>
				<div class="input_container">
					<input type="text" id="nickname" name="nickname" placeholder="닉네임을 입력해주세요" />
					<p class="nickname_alert"></p>
				</div>
				<label for="password">비밀번호</label>
				<div class="input_container">
					<div class="input_wrap">
						<input type="password" id="password" name="password" placeholder="비밀번호를 입력해주세요" />
						<button type="button" class="visible_button">
							<img src="./image/btn_visibility_on.png" alt="비밀번호 보기" class="visible_password" />
						</button>
					</div>
					<p class="password_alert"></p>
				</div>
				<label for="password_check">비밀번호 확인</label>
				<div class="input_container">
					<div class="input_wrap">
						<input
							type="password"
							id="password_check"
							name="password_check"
							placeholder="비밀번호를 다시 한 번 입력해주세요" />
						<button type="button" class="visible_button">
							<img src="./image/btn_visibility_on.png" alt="비밀번호 보기" class="visible_password" />
						</button>
					</div>
					<p class="pw_check_alert"></p>
				</div>
				<button class="signup_button auth_button btn_disable" type="submit">
					<a href="/login.html">회원가입</a>
				</button>
			</form>
			<div class="simple_login">
				<span>간편 로그인하기</span>
				<ul class="simple_login_list">
					<li>
						<a href="https://www.google.com/">
							<img src="./image/google.png" alt="google login" />
						</a>
					</li>
					<li>
						<a href="https://www.kakaocorp.com/page/">
							<img src="./image/kakao.png" alt="kakao login" />
						</a>
					</li>
				</ul>
			</div>
			<p>이미 회원이신가요? <a href="/login.html" class="login_link">로그인</a></p>
		</main>
		<script src="/signup.js"></script>
	</body>
</html>
