<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="styles/account/account.css" />
    <title>판다마켓 - 회원가입</title>
    <link rel="icon" href="/images/icon_favicon.png" />
  </head>

  <body>
    <div class="login-container">
      <header>
        <a href="/">
          <img src="images/logo.png" alt="판다마켓" class="image-logo" />
        </a>
      </header>

      <form class="form-account" action="login.html">
        <label class="label-account">
          이메일
          <input
            type="email"
            placeholder="이메일을 입력해주세요"
            class="input-account"
            id="email"
          />
          <p class="msg-error"></p>
        </label>

        <label class="label-account">
          닉네임
          <input
            type="text"
            placeholder="닉네임을 입력해주세요"
            class="input-account"
            id="nickname"
          />
          <p class="msg-error"></p>
        </label>

        <label class="label-account">
          비밀번호
          <input
            type="password"
            placeholder="비밀번호를 입력해주세요"
            class="input-account password"
            id="password"
          />
          <button class="btn-visibility-on" type="button"></button>
          <p class="msg-error"></p>
        </label>

        <label class="label-account">
          비밀번호 확인
          <input
            type="password"
            placeholder="비밀번호를 다시 입력해주세요"
            class="input-account password"
            id="password-confirm"
          />
          <button class="btn-visibility-on" type="button"></button>
          <p class="msg-error"></p>
        </label>

        <button class="btn-submit" type="submit" id="signup" disabled>
          회원가입
        </button>
      </form>

      <div class="social-login-container">
        <p>간편 로그인하기</p>
        <ul>
          <li>
            <a href="https://www.google.com/">
              <img src="./images/icon_google_login.png" alt="구글 로그인"
            /></a>
          </li>
          <li>
            <a href="https://www.kakaocorp.com/page/">
              <img src="./images/icon_kakao_login.png" alt="카카오 로그인"
            /></a>
          </li>
        </ul>
      </div>

      <p class="footer">이미 회원이신가요? <a href="/login.html">로그인</a></p>
    </div>

    <div class="unsupported-screen">
      <p>
        지원하지 않는 화면 크기입니다.<br />
        브라우저의 크기를 넓혀주세요.
      </p>
    </div>

    <script type="module" src="./scripts/accountValidation.js"></script>
    <script type="module" src="./scripts/passwordVisibility.js"></script>
  </body>
</html>
