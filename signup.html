<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 - 로그인</title>
    <link rel="icon" href="./image/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"

    />
    <link rel="stylesheet" href="./style/signup.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="title">
        <a href="./index.html"><img src="./image/panda.png" alt="판다로고"></a>
        <h1>판다마켓</h1>
      </div>
        <div input-form>
          <form>
          <div class="group">
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" placeholder="이메일을 입력해주세요."
            class="error-input">
            <p id="emailErr" class="errMsg">이메일을 입력해주세요.</p>
          </div>
          <div class="group">
            <label for="username">닉네임</label>
            <input type="username" id="username" name="username" placeholder="닉네임을 입력해주세요.">
            <p id="nicknameErr" class="errMsg"></p>
          </div>
          <div class="group">
            <label for="password">비밀번호</label>
            <div class="password-input">
            <input type="password" id="password" name="password" placeholder="비밀번호를 입력해주세요.">
            <img src="./image/invisible_icon.png" class="password-icon" alt="비밀번호 보기">
            <p id="passwordErr" class="errMsg">비밀번호를 8자 이상 입력해주세요.</p>
           </div>
          </div>
           <div class="group">
            <label for="password-repeat">비밀번호 확인</label>
             <div class="password-input">
              <input id="password-repeat" name="password-repeat" placeholder="비밀번호를 다시 한 번 입력해주세요."
              class="error-input">
             <img src="./image/eye_icon.png" class="password-icon1" alt="비밀번호 보기">
             <p id="passwordCheckErr" class="errMsg">비밀번호가 일치하지 않습니다.</p>
             </div>
          </div>
            <button type="submit">회원가입</button>
          </form>
        </div>
          <div class="bottom">
            <div class="input-bottom">
            <h1>간편 로그인하기</h1>
            <div class="social">
            <a href="https://www.google.co.kr/?hl=ko" target="blank">
              <img src="./image/google.png">
            </a>
            <a href="https://www.kakaocorp.com/page/service/service/KakaoTalk?lang=ko" target="blank">
              <img src="./image/kakaotalk.png">
            </a>
          </div>
        </div>
          </div>
          <div class="footer">
             <p>이미 회원이신가요?</p>
             <a href="./sign-in.html">로그인</a>
          </div>
          
        
    </div>
    <script src='./sign-up.js'></script>
  </body>
</html>
