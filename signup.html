<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>회원가입</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.6/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="global.css">
  </head>
  <body>
    <div class="content">
      <div class="head-img">
        <a class="login-link" href="/">
          <img class="pandaMarketImg" src="img/logo.png">
        </a>
      </div>
      <form action="/signup" method="post">
        <div>
          <label for="userName">이메일</label> 
          <input type="email" name="userEmail" id="userName" class="userName">
          <label for="nicname">닉네임</label>
          <input type="text" name="userName" id="nicname" class="nicname">
          <label for="userPassword">비밀번호</label>
          <input type="password" name="userPassword" id="userPassword" class="userPassword">
          <label for="checkPassword">비밀번호 확인</label>
          <input type="password" name="userPassword" id="checkPassword" class="checkPassword">
        </div>
        <div class="content-login">
          <button type="submit" class="login-button">회원가입</button>
        </div>
      </form>
      <div>
        <div class="blue-section">
          <p class="simpleLogin">간편 로그인하기</p>
          <ul class="social-links">
            <li>
              <a href="https://www.google.com/" target="_blank">
                <img class="social-icon" src="img/google.png" alt="google">
              </a>
            </li>
            <li>
              <a href="https://www.kakaocorp.com/page/" target="_blank">
                <img class="social-icon" src="img/kakao.png" alt="kakao">
              </a>
            </li>
          </ul>
        </div>
      </div>
      <div class="foot-content">
        <p class="insa">이미 회원이신가요?</p>
        <a class="membership" href="login.html">로그인</a>
      </div>
    </div>
  </body>
