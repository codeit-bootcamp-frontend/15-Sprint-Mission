<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="icon" href="images/icon/ic_favicon.png">
    <meta property="og:url" content="https://sprint-mission-04-insung.netlify.app/signup" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="판다마켓 : 회원가입" />
    <meta property="og:description" content="판다마켓 : 회원가입" />
    <meta property="og:image" content="https://sprint-mission-04-insung.netlify.app/images/logo/logo.png" />
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <script src="/js/authConstants.js" type="module"></script>
    <script src="/js/authEventManager.js" type="module"></script>
    <script src="/js/signUp.js" type="module"></script>
    <title>판다마켓 : 회원가입</title>
</head>
<body> 
    <main>
        <div class="auth-section">
            <a class="auth__logo-link" href="/">
                <img class="auth__logo" src="images/logo/logo.png" alt="메인으로 이동">
            </a>
            <form action="login.html" method="get" class="auth__form">
                <div class="auth-container">
                    <label class="auth__label" for="email">이메일</label>
                    <input class="auth__input" id="email" type="email" name="email" placeholder="이메일을 입력해주세요.">
                    <div class="email-error error"></div>
                </div>
                <div class="auth-container">
                    <label class="auth__label" for="nickname">닉네임</label>
                    <input class="auth__input" id="nickname" type="text" name="nickname" placeholder="닉네임을 입력해주세요.">
                    <div class="nickname-error error"></div>
                </div>
                <div class="auth-container">
                    <label class="auth__label" for="password">비밀번호</label> 
                    <div class="auth-container__password">
                        <input class="auth__input" id="password" type="password" name="password" placeholder="비밀번호를 입력해주세요.">
                        <button class="auth__password-toggle"type="button" aria-label="비밀번호 숨기기"></button>
                    </div>
                    <div class="pasword-error error"></div>
                </div>
                <div class="auth-container">
                    <label class="auth__label" for="password-confirm">비밀번호 확인</label> 
                    <div class="auth-container__password-confirm">
                        <input class="auth__input" id="password-confirm" type="password" name="password-confirm" placeholder="비밀번호를 입력해주세요.">
                        <button class="auth__password-toggle"type="button" aria-label="비밀번호 숨기기"></button>
                    </div>
                    <div class="confirm-error error"></div>
                </div>
                <button class="sign-up-button deactivate-button auth__button-layout" type="submit">회원가입</button>
            </form>
            <div class="auth__sns">
                <p class="auth__sns-title">간편 로그인 하기</p>
                <ul class="auth__sns-list">
                    <li class="auth__sns-item">
                        <a class="auth__sns-link" href="https://www.google.com/">
                            <img class="auth__sns-icon" src="images/icon/ic_google.png" alt="구글 로그인">
                        </a>
                    </li>
                    <li class="auth__sns-item">
                        <a class="auth__sns-link" href="https://www.kakaocorp.com/page/">
                            <img class="auth__sns-icon" src="images/icon/ic_kakaotalk.png" alt="카카오 로그인">
                        </a>
                    </li>
                </ul>
            </div>
            <p class="auth__other-page">
                이미 회원이신가요?
                <a class="auth__other-link" href="login.html">로그인</a>
            </p>
        </div>
    </main>
</body>
</html>
