    <script>
      window.addEventListener('DOMContentLoaded', function () {
        if (window.navigator.userAgent.match(/MSIE|Internet Explorer|Trident/i)) {
          alert('본 사이트는 Internet Explore 이용이 불가능합니다.');
          window.open('microsoft-edge:' + window.location.href);
        } else {
          document.getElementById('wrap').style.visibility = 'inherit';
        }
      });
    </script>

  <body>
    <a href="#container" class="skip-nav">본문 바로가기</a>
    <div id="wrap">
      <div id="container" class="auth-page signup">
        <div class="inner03">
          <a href="/" class="auth-logo">
            <img src="/images/sub/logo_big.svg" alt="판다마켓" />
          </a>
          <form id="authForm" class="auth-form">
            <ul class="auth-form">
              <li>
                <label for="email">이메일</label>
                <input type="text" id="email" placeholder="이메일을 입력하세요" />
                <p id="email-error" class="error-message message-empty">이메일을 입력해주세요.</p>
                <p id="email-error" class="error-message message-format">잘못된 이메일입니다.</p>
              </li>
              <li>
                <label for="nickname">닉네임</label>
                <input type="text" id="nickname" placeholder="닉네임을 입력하세요" />
                <p id="email-error" class="error-message message-empty">닉네임을 입력해주세요.</p>
              <li>
                <label for="password">비밀번호</label>
                <input type="password" id="password" placeholder="비밀번호를 입력하세요" />
                <button type="button" class="toggle-password">
                  <img src="images/common/ic_eye_off.svg" alt="비밀번호 보기" />
                </button>
                <p id="email-error" class="error-message message-empty">비밀번호를 입력해주세요.</p>
                <p id="email-error" class="error-message message-format">비밀번호를 8자 이상 입력해주세요.</p>
              </li>
              <li>
                <label for="password-confirm">비밀번호 확인</label>
                <input type="password" id="password-confirm" placeholder="비밀번호를 입력하세요" />
                <button type="button" class="toggle-password">
                  <img src="images/common/ic_eye_off.svg" alt="비밀번호 보기" />
                </button>
                <p id="email-error" class="error-message message-empty">비밀번호를 입력해주세요.</p>
                <p id="email-error" class="error-message message-format">비밀번호가 일치하지 않습니다.</p>
              </li>
            </ul>
            <button type="submit" class="auth-btn" disabled>회원가입</button>
          </form>
          <div class="auth-sns">
            <p>간편 로그인하기</p>
            <ul>
              <li>
                <a href="https://google.com" target="_blank"
                  ><img src="images/sub/login_sns_google.svg" alt="구글 로그인"
                /></a>
              </li>
              <li>
                <a href="https://kakao.com" target="_blank"
                  ><img src="images/sub/login_sns_kakao.svg" alt="카카오 로그인"
                /></a>
              </li>
            </ul>
          </div>
          <p class="auth-signup">이미 회원이신가요?<a href="/login.html">로그인</a></p>
        </div>
      </div>
    </div>
  </body>
</html>
