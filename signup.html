<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <title>판다마켓</title>
  </head>
  <body>
    <main class="main">
      <div class="logo-auth-box">
        <h1>
          <a href="/">
            <img src="assets/auth_logo.png" alt="판다마켓" />
          </a>
        </h1>
      </div>
      <div class="cont-area">
        <form action="./login.html" method="GET">
          <div class="group-input">
            <label for="inputEmail">이메일</label>
            <input
              type="email"
              class="input-font"
              id="inputEmail"
              placeholder="이메일을 입력하세요"
            />
            <span id="emailValidError" class="info-text"></span>
          </div>
          <div class="group-input">
            <label for="inputNickname">닉네임</label>
            <input
              type="text"
              class="input-font"
              id="inputNickname"
              placeholder="닉네임을 입력하세요"
            />
            <span id="nicknameValidError" class="info-text"></span>
          </div>
          <div class="group-input">
            <label for="inputPwd">비밀번호</label>
            <div class="inputPwd-wrap">
              <input
                type="password"
                class="input-font"
                id="inputPwd"
                placeholder="비밀번호를 입력하세요"
              />
            <button type="button" class="toggle-password" aria-label="비밀번호 숨기기">
              <img src="assets/visibility_off.png" alt="비밀번호 숨기기"/>
            </button>
            <span id="pwdValidError" class="info-text"></span>
            </div>
          </div>
          <div class="group-input">
            <label for="inputPwd2">비밀번호 확인</label>
            <div class="inputPwd-wrap">
              <input
                type="password"
                class="input-font"
                id="inputPwd2"
                placeholder="비밀번호를 입력하세요"
              />
              <button type="button" class="toggle-password" aria-label="비밀번호 숨기기">
                <img src="assets/visibility_off.png" alt="비밀번호 숨기기"/>
              </button>
              <span id="pwd2ValidError" class="info-text"></span>
            </div>
          </div>
          <button type="submit" id="signupBtn" class="btn login-btn btn-items">회원가입</button>
        </form>
        <div class="social-login-wrap">
          <div class="social-login-title">간편 로그인하기</div>
          <ul>
            <li>
              <a href="https://www.google.com">
                <img src="assets/social-google.png" alt="구글로그인" />
              </a>
            </li>
            <li>
              <a href="https://www.kakaocorp.com/page/">
                <img src="assets/social-kakao.png" alt="카카오로그인" />
              </a>
            </li>
          </ul>
        </div>
        <div class="sign-up-link">
          <span>이미 회원이신가요?</span>
          <a href="./login.html">로그인</a>
        </div>
      </div>
    </main>
    <script type="module" src="js/signup.js"></script>
  </body>
</html>
