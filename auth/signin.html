<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="icon" href="/images/panda_face.svg" type="image/svg" />
    <link rel="stylesheet" href="../index.css" />
    <title>판다마켓 로그인</title>
    <script type="module" src="./auth-validation.js"></script>
  </head>
  <body class="auth-body">
    <div class="auth-container">
      <header class="auth-header">
        <h1 class="logo-container">
          <a href="/">
            <img src="../images/panda_face.svg" alt="logo" class="logo" />
            <img
              src="../images/logo_typo.svg"
              alt="panda market"
              class="logo-typo"
            />
          </a>
        </h1>
      </header>

      <form class="auth-form" data-auth-type="signin" method="POST">
        <div class="input-container">
          <label for="email">이메일</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="이메일을 입력해주세요"
          />
          <div class="validation-error-message"></div>
        </div>

        <div class="input-container">
          <label for="password">비밀번호</label>
          <div class="password-input">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="비밀번호를 입력해주세요"
            />
            <button
              class="password-visibility eye-closed"
              id="password-visibility"
              type="button"
              aria-label="비밀번호 보이기"
            ></button>
          </div>
          <div class="validation-error-message"></div>
        </div>

        <button type="submit" class="auth-button" disabled>로그인</button>
      </form>

      <div class="oauth-container">
        <p>간편 로그인하기</p>
        <ul class="oauth-site">
          <li>
            <a href="https://www.google.com" class="oauth-button">
              <img src="../images/google_logo.svg" alt="google signin button" />
            </a>
          </li>
          <li>
            <a href="https://www.kakaocorp.com" class="oauth-button">
              <img src="../images/kakao_logo.svg" alt="kakao signin button" />
            </a>
          </li>
        </ul>
      </div>

      <div class="switch">
        판다마켓이 처음이신가요?&nbsp;
        <a href="signup.html" class="switch-button">회원가입</a>
      </div>
    </div>
  </body>
</html>
