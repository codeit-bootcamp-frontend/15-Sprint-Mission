<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>

    <!-- favicon 불러오기 -->
    <link rel="icon" type="image/svg" href="/image/logo.svg" />

    <!-- Pretendard 폰트 불러오기 -->
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <!-- normalize css 불러오기 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />

    <!-- css 불러오기 -->
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/auth/auth.css" />

    <!-- script 불러오기 -->
    <script defer type="module" src="/auth/common.js"></script>
    <script defer type="module" src="/auth/login.js"></script>
    <script defer type="module" src="/auth/password-visibility.js"></script>
  </head>

  <body class="body-login">
    <header class="banner">
      <a href="/">
        <img class="logo" src="/image/logo.svg" alt="판다마켓 로고" />
        <img class="logo-title" src="/image/logo_title.svg" alt="판다마켓" />
      </a>
    </header>

    <main>
      <form class="auth-form">
        <div class="input-box">
          <label for="email">이메일</label>
          <input
            name="email"
            id="email"
            type="email"
            placeholder="이메일을 입력해주세요"
          />
          <div class="email-error"></div>
        </div>

        <div class="input-box">
          <label for="password">비밀번호</label>
          <div class="pw-content">
            <input
              class="pw-visibility"
              name="password"
              id="password"
              type="password"
              placeholder="비밀번호를 입력해주세요"
            />
            <button type="button" class="button-eye">
              <img
                class="eye_icon"
                src="/image/password_toggle_icon.svg"
                alt="비밀번호를 보이지 않게 하는 눈 아이콘"
              />
            </button>
          </div>
          <div class="pw-error"></div>
        </div>

        <button id="button-login" type="button" class="button-submit" disabled>로그인</button>
      </form>
    </main>

    <footer>
      <section class="social-login">
        <span>간편 로그인하기</span>

        <div class="social-media">
          <ul>
            <li>
              <a href="http://www.google.com/" target="_blank">
                <img src="/image/google.png" alt="구글 로고" width="42" />
              </a>
            </li>
            <li>
              <a href="http://www.kakaocorp.com/page/" target="_blank">
                <img src="/image/kakao.png" alt="카카오톡 로고" width="42" />
              </a>
            </li>
          </ul>
        </div>
      </section>

      <section class="sign_up">
        <span>판다마켓이 처음이신가요?</span>
        <a href="/auth/signup.html">회원가입</a>
      </section>
    </footer>
  </body>
</html>
