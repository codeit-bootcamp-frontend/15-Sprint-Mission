<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="index.css" />
    <title>판다마켓</title>
    <script
      src="https://kit.fontawesome.com/0f08ea7d4a.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <a href="/" class="login-header">
        <img
          src="/assets/logos/login-logo-x1.svg"
          alt="판다마켓 로고"
          id="logo"
        />
      </a>
    </header>
    <main class="login-main">
      <form action="" method="post" class="login-form">
        <label for="email">이메일</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="이메일을 입력해주세요"
          class="login-input"
        />
        <label for="password">비밀번호</label>
        <div class="password-container">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="비밀번호를 입력해주세요"
            class="login-input"
          />
          <button type="button" class="password-toggle-icon">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
        <button class="login-btn">로그인</button>
      </form>
      <section class="login-social">
        <span>간편 로그인하기</span>
        <div class="social-icons">
          <a href="https://www.google.com" class="social-icon"
            ><img
              src="/assets/icons/login-google-icon.webp"
              alt="구글 로그인 이미지"
              class="social-icon-img" /></a
          ><a href="https://www.kakao.com" class="social-icon"
            ><img
              src="/assets/icons/login-kakao-icon.webp"
              alt="카카오 로그인 이미지"
              class="social-icon-img"
          /></a>
        </div>
      </section>
      <div class="login-sign-up">
        판다마켓이 처음이신가요?
        <a href="/signup/" class="sign-up-link"> 회원가입 </a>
      </div>
    </main>
  </body>
</html>
