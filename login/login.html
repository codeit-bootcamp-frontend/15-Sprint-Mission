<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 판다마켓</title>
    <link rel="stylesheet" href="/login/login.css">
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <a href="/index.html">
                <img src="/images/loginLogo.png" alt="판다마켓 로고">
            </a>
        </div>
        <form class="login-form">
            <div class="input-group">
                <label for="email">이메일</label>
                <input type="email" id="email" name="email" placeholder="이메일을 입력하세요." required>
                <p class="error-message" id="email-error"></p>
            </div>

            <div class="input-group">
                <label for="password">비밀번호</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요." required>
                    <span class="toggle-password">👁️</span>
                </div>
                <p class="error-message" id="password-error"></p>
            </div>

            <button type="submit" class="login-btn" id="login-btn" disabled>로그인</button>
        </form>

        <div class="social-login">
            <p>간편 로그인하기</p>
            <div class="social-icons">
                <img src="/images/Component 2.png" alt="Google 로그인">
                <img src="/images/Component 3.png" alt="Kakao 로그인">
            </div>
        </div>

        <p class="signup-text">판다마켓이 처음이신가요? <a href="/login/sing.html">회원가입</a></p>
    </div>

    <script>
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginBtn = document.getElementById("login-btn");

        const emailError = document.getElementById("email-error");
        const passwordError = document.getElementById("password-error");

        // 이메일 검증 함수
        function validateEmail() {
            const emailValue = emailInput.value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (emailValue === "") {
                emailError.textContent = "이메일을 입력해주세요.";
                emailInput.classList.add("error");
            } else if (!emailRegex.test(emailValue)) {
                emailError.textContent = "잘못된 이메일 형식입니다.";
                emailInput.classList.add("error");
            } else {
                emailError.textContent = "";
                emailInput.classList.remove("error");
            }
            checkFormValidity();
        }

        // 비밀번호 검증 함수
        function validatePassword() {
            const passwordValue = passwordInput.value.trim();

            if (passwordValue === "") {
                passwordError.textContent = "비밀번호를 입력해주세요.";
                passwordInput.classList.add("error");
            } else if (passwordValue.length < 8) {
                passwordError.textContent = "비밀번호를 8자 이상 입력해주세요.";
                passwordInput.classList.add("error");
            } else {
                passwordError.textContent = "";
                passwordInput.classList.remove("error");
            }
            checkFormValidity();
        }

        // 폼 유효성 검사 → 로그인 버튼 활성화 여부 결정
        function checkFormValidity() {
            if (emailError.textContent === "" && passwordError.textContent === "" && emailInput.value.trim() !== "" && passwordInput.value.trim() !== "") {
                loginBtn.disabled = false;
            } else {
                loginBtn.disabled = true;
            }
        }

        // 이벤트 리스너 추가
        emailInput.addEventListener("focusout", validateEmail);
        passwordInput.addEventListener("focusout", validatePassword);

        // 로그인 버튼 클릭 시 페이지 이동
        document.querySelector(".login-form").addEventListener("submit", function(event) {
            event.preventDefault(); // 기본 폼 제출 방지
            if (!loginBtn.disabled) {
                window.location.href = "/items";
            }
        });
    </script>
</body>
</html>
