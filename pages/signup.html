<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignUp</title>
    <link rel="stylesheet" href="/signup.css" />
  </head>
  <body>
    <div class="container">
      <div class="content-box">
        <div class="header-logo">
          <a href="/">
            <img
              class="loginLogoImg"
              src="/images/loginPageLogo.png"
              alt="판다마켓"
            />
          </a>
        </div>

        <div class="input-form-container">
          <div class="input-box-container">
            <label for="email">이메일</label>
            <input id="email" type="email" class="input-box" />
          </div>

          <div class="input-box-container">
            <label for="name">닉네임</label>
            <input id="name" type="text" class="input-box" />
          </div>

          <div class="input-box-container">
            <label for="password">비밀번호</label>
            <input id="password" type="password" class="input-box" />
          </div>

          <div class="input-box-container">
            <label for="conFirmPassword">비밀번호확인</label>
            <input id="conFirmPassword" type="password" class="input-box" />
          </div>
        </div>

        <div class="button-container">
          <button class="signup-button">회원가입</button>
        </div>

        <div class="simple-login-box">
          <div class="simple-login-content">
            <div class="simple-login-text">
              <p>간편 로그인하기</p>
            </div>

            <div class="logo-box">
              <a href="https://www.google.com/" target="_blank">
                <img src="/images/icons/googleLogo.png" alt="구글" />
              </a>
              <a href="https://www.kakaocorp.com/page/" target="_blank">
                <img src="/images/icons/kakaoLogo.png" alt="카카오" />
              </a>
            </div>
          </div>
        </div>

        <div class="register">
          <p class="register-text">이미 회원이신가요?</p>
          <a class="register-navigate" href="/pages/login.html">로그인</a>
        </div>
      </div>
    </div>
  </body>
</html>
