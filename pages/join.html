<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/pages/login/login.css" />
    <title>판다마켓 - join</title>
  </head>
  <body>
    <div class="total-container">
      <main class="loginContainer">
        <a href="../index.html" class="login-logo">
          <img src="../img/logo.png" / >
        </a>
        <div class="login-form-container">
          <form class="login-form">
            <label for="login-email">이메일</label>
            <input
              id="login-email"
              type="email"
              placeholder="이메일을 입력해주세요"
              required
            />
            <label for="login-nickname">닉네임</label>
            <input
              id="login-nickname"
              type="text"
              placeholder="닉네임을 입력해주세요"
              required
            />
            <label for="login-password">비밀번호</label>
            <input
              id="login-password"
              type="password"
              placeholder="비밀번호를 입력해주세요"
              required
            />
            <label for="login-password2">비밀번호 확인</label>
            <input
              id="login-password2"
              type="password"
              placeholder="비밀번호를 다시 입력해주세요"
              required
            />
            <button type="submit" id="login-submit">회원가입입</button>
          </form>
          <div class="social-login">
            <span>간편 로그인하기</span>
            <div class="social-login__img">
              <a href="https://www.google.com/" target="_blank"
                ><img src="../img/Img_google_login.png"
              /></a>
              <a href="https://www.kakaocorp.com/page/" target="_blank"
                ><img src="../img/Img_kakao_login.png"
              /></a>
            </div>
          </div>
          <div class="join">
            <span>이미 회원이신가요?</span>
            <a href="../pages/login.html">로그인</a>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
