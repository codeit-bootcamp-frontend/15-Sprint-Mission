<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/images/favicon.ico" />

    <!-- Open Graph  -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="판다마켓" />
    <meta property="og:description" content="일상의 모든 물건을 거래해보세요" />
    <meta property="og:url" content="https://hyunbara.netlify.app/" />
    <meta property="og:image" content="https://hyunbara4.netlify.app/images/thumbnail.jpg" />

    <!-- Twitter Open Graph -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="판다마켓" />
    <meta name="twitter:description" content="일상의 모든 물건을 거래해보세요" />
    <meta name="twitter:image" content="https://hyunbara4.netlify.app/images/thumbnail.jpg" />

    <!-- common.css 추가 -->
    <link rel="stylesheet" href="/common/common.css" />
    <link rel="stylesheet" href="/auth/account.css" />

    <!-- defer 추가 -->
    <script defer src="/auth/toggle-password.js"></script>
    <script type="module" defer src="/auth/login-validation.js"></script>

    <!-- pretendard cdn -->
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />

    <!-- normalize.css CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
      integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- fontAwsome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />

    <title>Login</title>
  </head>
  <body>
    <div class="login-page">
      <div class="form">
        <img src="/images/login_img/pandalogo.png" alt="판다마켓 이미지" class="form-image" onclick="goHomepage()" />
        <!-- login form -->
        <form class="login-form">
          <!-- email label -->
          <label for="form-email">
            이메일
            <input type="text" name="userEmail" placeholder="codeit@email.com" id="form-email" />
          </label>

          <!-- 로그인 유효성 검사 에러 메세지 -->
          <p id="email-error" style="color: red; font-size: 14px; font-weight: 600; text-align: left; margin-bottom: 24px; display: none"></p>

          <!-- password label -->
          <label for="form-password">
            비밀번호
            <div class="password-box">
              <input type="password" name="userPassword" placeholder="password" id="form-password" />
              <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('form-password', this)"></i>
            </div>
          </label>

          <!-- 패스워드 유효성 검사 에러 메세지 -->
          <p id="password-error" style="color: red; font-size: 14px; font-weight: 600; text-align: left; margin-bottom: 24px; display: none"></p>

          <button id="btn-login" class="auth-button" onclick="location.href='/pages/items.html'" type="button">로그인</button>
        </form>
      </div>
      <!-- 간편 로그인 -->
      <div class="easy-login">
        <span>간편 로그인 하기</span>
        <div class="easy-login-icon">
          <a href="https://www.google.com/"> <img src="/images/login_img/google_img.png" /></a>
          <a href="https://www.kakaocorp.com/page/service/service/KakaoTalk" class="kakao-img"> <img src="/images/login_img/kakako_img.png" /></a>
        </div>
      </div>
      <!-- 최하단 메시지 요소 -->
      <div class="message-box">
        <p class="message">
          판다마켓이 처음이신가요?
          <a href="/pages/signup.html">회원가입</a>
        </p>
      </div>
    </div>
  </body>
</html>
