<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="/login.css" />
  </head>
  <body>
    <div class="container">
      <div class="content-box">
        <div class="header-logo">
          <a href="/">
            <img
              class="loginLogoImg"
              src="/images/loginPageLogo.png"
              alt="loginLogo"
            />
          </a>
        </div>

        <div class="input-form-container">
          <div class="input-box-container">
            <label for="email">이메일</label>
            <input
              id="email"
              type="email"
              class="input-box"
              placeholder="이메일을 입력해주세요"
            />
          </div>

          <div class="input-box-container">
            <label for="password">비밀번호</label>

            <div class="wrapper-for-icon">
              <input
                id="password"
                type="password"
                class="input-box"
                placeholder="비밀번호를 입력해주세요"
              />
              <img
                class="passwordIcon"
                src="/images/icons/eyesIcon.png"
                alt="비밀번호아이콘"
              />
            </div>
          </div>
        </div>

        <div class="button-container">
          <button class="login-button">로그인</button>
        </div>

        <div class="simple-login-box">
          <div class="simple-login-content">
            <div class="simple-login-text">
              <p>간편 로그인하기</p>
            </div>

            <div class="logo-box">
              <a href="https://www.google.com/" target="_blank">
                <img src="/images/icons/googleLogo.png" alt="구글" />
              </a>
              <a href="https://www.kakaocorp.com/page/" target="_blank">
                <img src="/images/icons/kakaoLogo.png" alt="카카오" />
              </a>
            </div>
          </div>
        </div>

        <div class="register">
          <p class="register-text">판다마켓이 처음이신가요?</p>
          <a class="register-navigate" href="/pages/signup.html">회원가입</a>
        </div>
      </div>
    </div>
  </body>
</html>
