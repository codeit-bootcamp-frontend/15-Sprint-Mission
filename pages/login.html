<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/login.css">
</head>
<body>
    <div class="container">
        <div class="content-box">
            <div class="header-logo">
                <a href="/">
                    <img class="loginLogoImg" src="/images/loginPageLogo.png" alt="loginLogo">
                </a>
            </div>

        <div class="input-form-container">

            <div class="email-input-box">
             <label for="email">이메일</label>
             <input id="email" type="email" class="input-box">
            </div>

            <div class="password-input-box">
                <label for="password">비밀번호</label>
                <input id="password" type="password" class="input-box">  
            </div>

           <div>
            <button class="login-button">로그인</button>
           </div>
           

        </div>    

        <div class="simple-login-box">
         
        <p>간편 로그인하기</p>


        <div class="logo-box">
            <p>로그1</p>
            <p>로그2</p>
        </div>


        </div>


        <div class="register">
            <p class="register-text">판다마켓이 처음이신가요?</p>
        </div>




        </div>




    </div>
</body>
</html>
