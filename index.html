<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="icon-img/panda-face.png" />
    <title>판다마켓</title>
    <meta name="description" content="판다마켓 홈페이지" />
    <meta property="og:title" content="판다마켓" />
    <meta property="og:image" content="img/img-home-top" />
    <meta property="og:description" content="일상의 모든 물건을 거래해보세요" />
    <meta property="og:url" content="https://sprint3-misson.netlify.app/" />
    <meta property="og:type" content="website" />
    <!--twitter-->
    <meta name="twitter:card" content="일상의 모든 물건을 거래해보세요" />
    <meta name="twitter:title" content="판다마켓" />
    <meta
      name="twitter:description"
      content="일상의 모든 물건을 거래해보세요"
    />
    <meta name="twitter:image" content="img/img-home-top" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- header 이미지 -->
    <header>
      <div class="header-content">
        <a href="/">
          <img
            class="header-img"
            src="icon-img/panda-face.png"
            alt="판다마켓 로고"
          />
          <img class="header-title" src="icon-img/판다마켓.svg" />
        </a>
        <a class="login-button" href="/login.html" target="_self">로그인</a>
      </div>
    </header>
    <!--  main 이미지 -->
    <main>
      <div class="container">
        <div class="top-banner">
          <div class="content">
            <h2 class="top-title">
              일상의 모든 물건을
              <span class="top-title-text">거래해 보세요</span>
            </h2>
            <a href="/item.html">
              <button class="item-button">구경하러 가기</button>
            </a>
          </div>
          <img
            class="banner-img"
            src="img/img-home-top.png"
            alt="한 손들고 장 보러 가는 판다 그림"
          />
        </div>
      </div>
      <div class="main-content">
        <div class="main-section">
          <img
            class="main-img"
            src="img/img-main-1.png"
            alt="두 마리의 판다와 녹색 옷 그림"
          />
          <div class="main-description">
            <p class="description-tag">Hot item</p>
            <h2 class="description-title">
              인기 상품을
              <span class="main-title-text">확인해 보세요</span>
            </h2>
            <p class="description-subTitle">
              가장 HOT한 중고거래 물품을<br />
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </div>

      <div class="main-content">
        <div class="main-section-2">
          <img
            class="main-img"
            src="img/img-main-2.png"
            alt="돋보기로 찾는 그림"
          />
          <div class="main-description-2">
            <p class="description-tag">Search</p>
            <h2 class="description-title">
              구매를 원하는
              <span class="main-title-text">상품을 검색하세요</span>
            </h2>
            <p class="description-subTitle">
              구매하고 싶은 물품은 검색해서<br />
              쉽게 찾아보세요
            </p>
          </div>
        </div>
      </div>

      <div class="main-content">
        <div class="main-section-3">
          <img
            class="main-img"
            src="img/img-main-3.png"
            alt="연필,수첩,안경 등 상품을 등록하는 그림"
          />
          <div class="main-description-3">
            <p class="description-tag">Register</p>
            <h2 class="description-title">
              판매를 원하는
              <span class="main-title-text">상품을 등록하세요</span>
            </h2>
            <p class="description-subTitle">
              어떤 물건이든 판매하고 싶은 상품을<br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </div>
    </main>
    <!-- footer 이미지 -->
    <footer>
      <div class="container">
        <div class="bottom-banner">
          <h2 class="section-2">
            믿을 수 있는<br />
            판다마켓 중고 거래
          </h2>
          <img
            class="banner-img"
            src="img/Img-home-bottom.png"
            alt="두 마리의 판다가 기분 좋은 얼굴로 한 손들고 인사하며 대화하는 그림"
          />
        </div>
      </div>
      <div class="footer-background">
        <div class="footer-content">
          <p class="footer-small">©codeit - 2024</p>
          <div class="footer-buttons">
            <a class="footer-button" href="/privacy.html">Privacy Policy</a>
            <a class="footer-button" href="/faq.html">FAQ</a>
          </div>
          <ul class="social-icon">
            <li>
              <a href="https://www.facebook.com/" target="_blank">
                <img class="icon" src="icon-img/facebook-icon.png" />
              </a>
            </li>
            <li>
              <a href="https://x.com/" target="_blank">
                <img class="icon" src="icon-img/twitter-icon.png" />
              </a>
            </li>
            <li>
              <a href="https://www.youtube.com/" target="_blank">
                <img class="icon" src="icon-img/youtube-icon.png" />
              </a>
            </li>
            <li>
              <a href="https://www.instagram.com/" target="_blank">
                <img class="icon" src="icon-img/instagram-icon.png" />
              </a>
            </li>
          </ul>
        </div>
      </div>
    </footer>
  </body>
</html>
