<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/layout/layout.css" />
    <link rel="stylesheet" href="/styles/variable.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <script src="layout/render.js" defer></script>

  <body>
    <header>
      <nav id="nav"></nav>

      </section>
    </header>
    <main class="main">
      <section class="main-feature">
        <img src="/assets/home/main-feature1.webp" alt="인기 상품" />
        <span class="feature-category"></span>
        <span class="feature-title"></span>
        <span class="feature-description"></span>
      </section>
      <section class="main-feature">
        <img src="/assets/home/main-feature2.webp" alt="상품 검색" />
        <span class="feature-category"></span>
        <span class="feature-title"></span>
        <span class="feature-description"></span>
      </section>
      <section class="main-feature">
        <img src="/assets/home/main-feature3.webp" alt="상품 등록" />
        <span class="feature-category"></span>
        <span class="feature-title"></span>
        <span class="feature-description"></span>
      </section>
    </main>
    <footer id="footer"></footer>
  </body>
</html>
