<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <link rel="stylesheet" href="/index.css">
</head>
<body>

    <!-- 네비게이션 바 -->
    <header class="navbar">
        <div class="logo">
            <img src="/images/headerLogo.png" alt="판다마켓 로고">
        </div>
        <button class="login-btn"><a href="/login/login.html">로그인</a></button>
    </header>

    <!-- 히어로 섹션 -->
    <section class="hero">
        <div class="hero-content">
            <div class="hero-text">
                <h1>일상의 모든 물건을 거래해 보세요</h1>
                <a href="/items.html" class="cta-button">구경하러 가기</a>
            </div>
        </div>
        <div class="hero-image"></div>
    </section>

    <!-- 메인 콘텐츠 -->
    <section class="feature-section">
        <div class="feature-card">
            <div class="feature-image">
                <img src="/images/mainImg1.png" alt="Hot Item">
            </div>
            <div class="feature-text">
                <h3><span class="feature-category hot">Hot Item</span></h3>
                <p  class="feature-title">인기 상품을 확인해 보세요</p>
                <p>가장 HOT한 중고거래 물품을 판다 마켓에서 확인해 보세요</p>
            </div>
        </div>
    
        <div class="feature-card">
            <div class="feature-image">
                <img src="/images/mainImg2.png" alt="Search Item">
            </div>
            <div class="feature-text">
                <h3><span class="feature-category search">Search</span></h3>
                <p class="feature-title"> 구매를 원하는 상품을 검색하세요</p>
                <p>구매하고 싶은 물품을 검색해서 쉽게 찾아보세요</p>
            </div>
        </div>
    
        <div class="feature-card">
            <div class="feature-image">
                <img src="/images//mainImg3.png" alt="Register Item">
            </div>
            <div class="feature-text">
                <h3><span class="feature-category register">Register</span></h3>
                <p  class="feature-title"> 판매를 원하는 상품을 등록하세요</p>
                <p>어떤 물건이든 판매하고 싶은 상품을 쉽게 등록하세요</p>
            </div>
        </div>
    </section>
    
    <!-- 섹션 -->
    <section>
        <div class="section">
            <div class="section-content">
                <div class="section-text">
                    <h1>믿을 수 있는 판다마켓 중고 거래</h1>
                </div>
            </div>
            <div class="section-image"></div>
        </div>
        
    </section>

    <!-- 푸터 -->
    <footer class="footer">
        <div class="container">
            <p>©codeit - 2024</p>
            <div class="footer-links">
                <a href="#">Privacy Policy</a> <a href="#">FAQ</a>
            </div>
            <div class="iconWrap">
                <div class="facebook"></div>
                <div class="twitter"></div>
                <div class="youtube"></div>
                <div class="instagram"></div>
            </div>
        </div>
        
    </footer>

</body>
</html>
