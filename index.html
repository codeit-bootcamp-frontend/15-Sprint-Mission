<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/sections.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <title>판다마켓</title>
  </head>
  <body>
    <header class="header fixed">
      <div class="header-container">
        <a href="/" class="logo">
          <img src="public/logos/panda-market-logo.png" alt="판다로고" />
        </a>

        <a href="login.html" class="login-btn">로그인</a>
      </div>
    </header>
    <main>
      <section class="main-banner banner" id="hero">
        <div class="wrapper">
          <h1>일상의 모든 물건을<br />거래해 보세요</h1>
          <a href="items.html" class="action-btn button pill-button"
            >구경하러 가기</a
          >
        </div>
      </section>

      <section id="features" class="wrapper">
        <div class="feature">
          <img src="public/images/img_home_01.png" alt="핫아이템" width="50%" />
          <div class="feature-content">
            <h2 class="feature-tag">Hot Item</h2>
            <h1>인기 상품을<br />확인해 보세요</h1>
            <p class="feature-description">
              가장 Hot한 중고거래 물품을<br />
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
        <div class="feature">
          <div class="feature-content">
            <h2 class="feature-tag">Search</h2>
            <h1>구매를 원하는<br />상품을 검색하세요</h1>
            <p class="feature-description">
              구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
            </p>
          </div>
          <img src="public/images/img_home_02.png" alt="서치" width="50%" />
        </div>
        <div class="feature">
          <img src="public/images/img_home_03.png" alt="레지스터" width="50%" />
          <div class="feature-content">
            <h2 class="feature-tag">Register</h2>
            <h1>판매를 원하는<br />상품을 등록하세요</h1>
            <p class="feature-description">
              어떤 물건이든 판매하고 싶은 상품을<br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>

      <section class="bottom-banner banner" id="bottomBanner">
        <div class="wrapper">
          <h1>믿을 수 있는<br />판다마켓 중고 거래</h1>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="footer-container">
        <div class="footer-info">
          <span>©codeit - 2024</span>
        </div>
        <div class="footer-links">
          <a href="privacy.html">Privacy Policy</a>
          <a href="faq.html">FAQ</a>
        </div>
        <ul class="social-links">
          <li>
            <a href="https://facebook.com" target="_blank" class="social-icon">
              <img src="public/icons/ic_facebook.png" alt="페이스북" />
            </a>
          </li>
          <li>
            <a href="https://x.com" target="_blank" class="social-icon">
              <img src="public/icons/ic_twitter.png" alt="트위터" />
            </a>
          </li>
          <li>
            <a href="https://youtube.com" target="_blank" class="social-icon">
              <img src="public/icons/ic_youtube.png" alt="유튜브" />
            </a>
          </li>
          <li>
            <a href="https://instagram.com" target="_blank" class="social-icon">
              <img src="public/icons/ic_instagram.png" alt="인스타" />
            </a>
          </li>
        </ul>
      </div>
    </footer>
  </body>
</html>
