<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>판다마켓</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.6/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <div class="all">
        <div class="title-head">
          <a class="login-link" href="/">
            <img class="title-logo" src="img/rogo1.png">
          </a>
          <button class="login">
            <a class="login-link" href="/login">로그인</a>
          </button>
        </div>
      </div>      
    </header>
    <section class="blue-section">
      <div class="all">
        <div class="Nemo">
          <div class="miniNemo">
            <h2 class="title">
              일상의 모든 물건을<br>
              거래해 보세요
            </h2>
            <button class="button-buy">
              <a class="login-link" href="/items">구경하러 가기</a>
            </button>
          </div>  
          <img class="panda-pic" src="img/panda1.png" alt="fashionist_panda">
        </div>
      </div>
    </section>
    <section class="white-section">
      <div class="all">
        <div class="nemonemo">
          <img class="main-pic" src="img/hukuHeart.png" alt="panda_look_clothes">
          <div class="contents">
            <span class="headPoint">
              Hot item
            </span>
            <h2 class="title">
              인기 상품을<br>
              확인해 보세요
            </h2>
            <p class="content">가장 HOT한 중고거래 물품을 판다 마켓에서 확인해 보세요</p>
          </div>
        </div>
      </div>
    </section>
    <section class="white-section">
      <div class="all">
        <div class="nemonemo">
          <div class="contents">
            <span class="headPoint">
              Search
            </span>
            <h2 class="title">
              구매를 원하는<br>
              상품을 검색하세요
            </h2>
            <p class="content">구매하고 싶은 물품을 검색해서 쉽게 찾아보세요</p>
          </div>
          <img class="main-pic" src="img/zoom.png" alt="lens-pic">
        </div>   
      </div>
    </section>
    <section class="white-section">
      <div class="all">
        <div class="nemonemo">
          <img class="main-pic" src="img/sq.png" alt="sellWishProduct">
          <div class="contents">
            <span class="headPoint">
              Register
            </span>
            <h2 class="title">
              판매를 원하는<br>
              상품을 등록하세요
            </h2>
            <p class="content">어떤 물건이든 판매하고 싶은 상품을 쉽게 등록하세요</p>
          </div>
        </div>
      </div>
    </section>
    <section class="blue-section">
      <div class="all">
        <div class="Nemo">
          <div class="miniNemo">
            <h2 class="title">
              믿을 수 있는<br>
              판다마켓 중고 거래
            </h2>
          </div>
          <img class="greeting-panda-pic" src="img/pandaLa.png" alt="greeting_panda">
        </div>
      </div>
    </section>
    <footer>
      <div class="all">
        <div class="foot">
          <div class="codeit-2024">
           @codeit-2024
         </div>
         <div class="privacyPolicy-FAQ">
            <a class="link-line" href="/privacy">Privacy Policy</a>
            <a class="link-line" href="/faq">FAQ</a>
         </div>
         <div class="sns-link">
            <a href="https://www.facebook.com" target="blank">
             <img class="link-logo" src="img/Facebook.png" alt="Facebook">
            </a>
            <a href="https://www.twitter.com" target="blank">
              <img class="link-logo" src="img/twiter.png" alt="twitter">
            </a>
            <a href="https://www.youtube.com" target="blank">
             <img class="link-logo" src="img/youtube.png" alt="youtube">
            </a>
            <a href="https://www.instagram.com" target="blank">
              <img class="link-logo" src="img/instagram.png" alt="instagram">
            </a>
          </div>
        </div>
      </div>
    </footer>
  </body>
