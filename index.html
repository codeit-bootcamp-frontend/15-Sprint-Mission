      name="twitter:description"
      content="일상의 모든 물건을 거래해보세요"
    />
    <meta
      name="twitter:image"

    />
    <meta
      name="twitter:url"
      content="https://codeit-sprint15-mission.netlify.app/"
    />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="icon" href="/images/panda_face.svg" type="image/svg" />
    <link rel="stylesheet" href="index.css" />
    <title>판다마켓</title>
  </head>
  <body>
    <script type="module" src="./index.js"></script>
    <header class="home-header">
      <div class="home-header-content">
        <h1 class="logo-container">
          <a href="/">
            <img src="images/panda_face.svg" alt="logo" class="logo" />
            <img
              src="images/logo_typo.svg"
              alt="panda market"
              class="logo-typo"
            />
          </a>
        </h1>
        <a href="./auth/login.html" class="login-button">로그인</a>
      </div>
    </header>

    <main>
      <section class="banner">
        <div class="banner-content">
          <h2 class="banner-title">
            일상의 모든 물건을
            <span class="change-line mobile-line">거래해 보세요</span>
          </h2>
          <a href="/items">
            <button class="view-button">구경하러 가기</button>
          </a>
        </div>
        <img
          src="/images/home_top.svg"
          alt="A panda mascot waving its hand"
          class="banner-img"
        />
      </section>
      <section class="home-cards">
        <div class="home-card-content">
          <img
            src="images/home_01.svg"
            alt="Two pandas looking at a green shirt"
            class="home-card-img"
          />
          <div class="home-card-info">
            <div class="home-card-badge">Hot item</div>
            <h2 class="home-card-title">
              인기 상품을
              <span class="change-line">확인해 보세요</span>
            </h2>
            <p class="home-card-description">
              가장 HOT한 중고거래 물품을
              <br />
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>

        <div class="home-card-content">
          <img
            src="images/home_02.svg"
            alt="Searching a product to buy"
            class="home-card-img"
          />
          <div class="home-card-info">
            <div class="home-card-badge">Search</div>
            <h2 class="home-card-title">
              구매를 원하는
              <span class="change-line">상품을 검색하세요</span>
            </h2>
            <p class="home-card-description">
              구매하고 싶은 물품은 검색해서
              <br />
              쉽게 찾아보세요
            </p>
          </div>
        </div>

        <div class="home-card-content">
          <img
            src="images/home_03.svg"
            alt="Upload a product to sell"
            class="home-card-img"
          />
          <div class="home-card-info">
            <div class="home-card-badge">Register</div>
            <h2 class="home-card-title">
              판매를 원하는
              <span class="change-line">상품을 등록하세요</span>
            </h2>
            <p class="home-card-description">
              어떤 물건이든 판매하고 싶은 상품을<br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>
      <section class="bottom">
        <div class="banner">
          <div class="banner-content">
            <h2 class="banner-title">
              믿을 수 있는
              <br />
              판다마켓 중고 거래
            </h2>
          </div>
          <img
            src="images/home_bottom.svg"
            alt="Two pandas trading products"
            class="banner-img"
          />
        </div>
      </section>
    </main>
    <footer>
      <div class="footer-content">
        <div class="copyright">&copy;codeit - 2024</div>
        <a href="/privacy" class="privacy">Privacy Policy</a>
        <a href="/faq" class="faq">FAQ</a>
        <ul class="social-media">
          <li>
            <a
              href="https://www.facebook.com"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img src="images/facebook.svg" alt="facebook" />
            </a>
          </li>
          <li>
            <a
              href="https://www.twitter.com"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img src="images/twitter.svg" alt="twitter" />
            </a>
          </li>
          <li>
            <a
              href="https://www.youtube.com"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img src="images/youtube.svg" alt="youtube" />
            </a>
          </li>
          <li>
            <a
              href="https://www.instagram.com"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img src="images/instagram.svg" alt="instagram" />
            </a>
          </li>
        </ul>
      </div>
    </footer>
  </body>
</html>
