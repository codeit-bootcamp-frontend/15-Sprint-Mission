<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SNS 공유 미리보기 메타 태그 -->
    <meta
      name="description"
      content="판다마켓에서 일상의 모든 물건을 거래해보세요"
    />

    <!-- 오픈 그래프(Open Graph) 메타 태그 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="판다 마켓" />
    <meta property="og:description" content="일상의 모든 물건을 거래해보세요" />
    <meta
      property="og:image"
      content="https://leech-spfe15-panda-market.netlify.app/public/logos/panda-market.png"
    />
    <meta
      property="og:url"
      content="https://leech-spfe15-panda-market.netlify.app/"
    />

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/typography.css" />
    <link rel="stylesheet" href="css/buttons.css" />
    <link rel="stylesheet" href="css/sections.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <title>판다마켓</title>
  </head>
  <body>
    <header class="header">
      <div class="header-container">
        <a href="/" class="logo">
          <img src="public/logos/panda-market.png" alt="판다로고" />
        </a>

        <a href="login.html" class="login-btn">로그인</a>
      </div>
    </header>
    <main>
      <section class="main-banner banner" id="hero">
        <div class="wrapper">
          <h1>
            일상의 모든 물건을
            <span class="responsive-break"><br /></span>
            거래해보세요
          </h1>
          <a href="items.html" class="action-btn button pill-button">
            구경하러 가기
          </a>
        </div>
      </section>

      <section id="features" class="wrapper">
        <div class="feature">
          <img src="public/images/img_home_01.png" alt="핫아이템" width="50%" />
          <div class="feature-content">
            <h3 class="feature-tag">Hot Item</h3>
            <h2>
              인기 상품을
              <span class="responsive-break"><br /></span>
              확인해보세요
            </h2>
            <p class="feature-description">
              가장 Hot한 중고거래 물품을<br />
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
        <div class="feature">
          <div class="feature-content">
            <h3 class="feature-tag">Search</h3>
            <h2>
              구매를 원하는
              <span class="responsive-break"><br /></span>
              상품을 검색하세요
            </h2>
            <p class="feature-description">
              구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
            </p>
          </div>
          <img src="public/images/img_home_02.png" alt="서치" width="50%" />
        </div>
        <div class="feature">
          <img src="public/images/img_home_03.png" alt="레지스터" width="50%" />
          <div class="feature-content">
            <h3 class="feature-tag">Register</h3>
            <h2>
              판매를 원하는
              <span class="responsive-break"><br /></span>
              상품을 등록하세요
            </h2>
            <p class="feature-description">
              어떤 물건이든 판매하고 싶은 상품을<br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>

      <section class="bottom-banner banner" id="bottomBanner">
        <div class="wrapper">
          <h2>믿을 수 있는<br />판다마켓 중고 거래</h2>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="footer-container">
        <div class="footer-info">
          <span>©codeit - 2024</span>
        </div>
        <div class="footer-links">
          <a href="privacy.html">Privacy Policy</a>
          <a href="faq.html">FAQ</a>
        </div>
        <ul class="social-links">
          <li>
            <a href="https://facebook.com" target="_blank" class="social-icon">
              <img src="public/icons/ic_facebook.png" alt="페이스북" />
            </a>
          </li>
          <li>
            <a href="https://x.com" target="_blank" class="social-icon">
              <img src="public/icons/ic_twitter.png" alt="트위터" />
            </a>
          </li>
          <li>
            <a href="https://youtube.com" target="_blank" class="social-icon">
              <img src="public/icons/ic_youtube.png" alt="유튜브" />
            </a>
          </li>
          <li>
            <a href="https://instagram.com" target="_blank" class="social-icon">
              <img src="public/icons/ic_instagram.png" alt="인스타" />
            </a>
          </li>
        </ul>
      </div>
    </footer>
  </body>
</html>
