<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/layout/layout.css" />
    <link rel="stylesheet" href="/styles/variable.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <script src="layout/render.js" defer></script>
  </head>
  <body>
    <header>
      <nav id="nav"></nav>
      <section class="hero">
        <div class="hero-content">
          <h1>일상의 모든 물건을<br />거래해보세요</h1>
          <a href="/items" class="hero-explore-button">구경하러 가기</a>
          <img src="" alt="" class="hero-img">
        </div>
      </section>
    </header>
    <main class="main">
      <section class="main-feature">
        <img src="/assets/home/main-feature1.webp" alt="인기 상품" />
        <div class="feature-category">Hot item</div>
        <div class="feature-title">인기 상품을 확인해보세요</div>
        <div class="feature-description"></div>
          가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해보세요
        </div>
      </section>
      <section class="main-feature right">
        <img src="/assets/home/main-feature2.webp" alt="상품 검색" />
        <div class="feature-category">Search</div>
        <div class="feature-title">구매를 원하는 상품을 검색하세요</div>
        <div class="feature-description">
          구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
        </div>
      </section>
      <section class="main-feature">
        <img src="/assets/home/main-feature3.webp" alt="상품 등록" />
        <div class="feature-category">register</div>
        <div class="feature-title">판매를 원하는 상품을 등록하세요</div>
        <div class="feature-description">
          어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
        </div>
      </section>
    </main>
    <footer id="footer"></footer>
  </body>
</html>
