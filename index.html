<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="icon" href="images/logo/favicon.ico" />

    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <link rel="stylesheet" href="./css/main.css" />
  </head>

  <body>
    <header>
      <a href="/"><img src="images/logo/panda-market-logo.png" alt="판다마켓 로고" width="153" /></a>
      <a href="login.html" id="mainLoginBtn" class="button">로그인</a>
    </header>

    <main>
      <section id="topBanner" class="bannerImage">
        <div class="wrapper">
          <h1>
            일상의 모든 물건을<br />
            거래해보세요
          </h1>
          <a
            href="items.html"
            class="button"
            style="font-size: 20px; font-weight: 700; padding: 16px 124px; border-radius: 40px; margin-top: 32px"
            >구경하러 가기</a
          >
        </div>
      </section>

      <section style="padding-bottom: 138px" class="wrapper">
        <div class="productInfo">
          <img src="images/home/hotItem-image.png" alt="인기 상품 확인" width="50%" />
          <div>
            <div>
              <h2 style="color: #3692ff; font-size: 18px; font-weight: 700px; line-height: 26px; margin-bottom: 12px">
                Hot item
              </h2>
              <h1>인기 상품을<br />확인해 보세요</h1>
              <p style="font-size: 24px; font-weight: 500; line-height: 32px; letter-spacing: 0.05em; margin-top: 24px">
                가장 HOT한 중고거래 물품을<br />판다마켓에서 확인해 보세요
              </p>
            </div>
          </div>
        </div>

        <div class="productInfo">
          <div>
            <div>
              <h2 style="color: #3692ff; font-size: 18px; font-weight: 700px; line-height: 26px; margin-bottom: 12px">
                Search
              </h2>
              <h1>구매를 원하는<br />상품을 검색하세요</h1>
              <p style="font-size: 24px; font-weight: 500; line-height: 32px; letter-spacing: 0.05em; margin-top: 24px">
                구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
              </p>
            </div>
          </div>
          <img src="images/home/search-image.png" alt="구매 상품 검색" width="50%" />
        </div>

        <div class="productInfo">
          <img src="images/home/register-image.png" alt="판매 상품 등록" width="50%" />
          <div>
            <div>
              <h2 style="color: #3692ff; font-size: 18px; font-weight: 700px; line-height: 26px; margin-bottom: 12px">
                Register
              </h2>
              <h1>판매를 원하는<br />상품을 등록하세요</h1>
              <p style="font-size: 24px; font-weight: 500; line-height: 32px; letter-spacing: 0.05em; margin-top: 24px">
                어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
              </p>
            </div>
          </div>
        </div>
      </section>

      <section id="bottomBanner" class="bannerImage">
        <div class="wrapper">
          <h1>
            믿을 수 있는 <br />
            판다마켓 중고거래
          </h1>
        </div>
      </section>
    </main>

    <footer>
      <div>@codeit - 2024</div>
      <div id="footerMeun">
        <a href="privacy.html">Privacy Policy</a>
        <a href="faq.html">FAQ</a>
      </div>

      <div id="social">
        <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer"
          ><img src="images/socialIcon/facebook-logo.svg" alt="facebook" width="20"
        /></a>

        <a href="https://twitter.com/" target="_blank" rel="noopener noreferrer"
          ><img src="images/socialIcon/twitter-logo.svg" alt="twitter" width="20"
        /></a>

        <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer"
          ><img src="images/socialIcon/youtube-logo.svg" alt="youtube" width="20"
        /></a>

        <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer"
          ><img src="images/socialIcon/instagram-logo.svg" alt="instagram" width="20"
        /></a>
      </div>
    </footer>
  </body>
</html>
