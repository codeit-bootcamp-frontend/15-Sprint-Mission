  <body>
    <header class="banner">
      <div class="banner-content">
        <div class="logo-content">
          <a class="logo" href="/"
            ><img src="/image/logo.svg" alt="판다마켓 로고 이미지"
          /></a>
          <a class="logo-text" href="/"
            ><img src="/image/logo_title.svg" alt="판다마켓 로고 글씨"
          /></a>
        </div>
        <a class="login" href="/auth/login.html">로그인</a>
      </div>
    </header>

    <main>
      <!-- Main Header -->
      <section class="header-container">
        <div class="header-content">
          <div class="header-text">
            <h1 class="header-title">
              <span>일상의 모든 물건을</span>
              거래해 보세요
            </h1>
            <div class="explore-button-container">
              <a class="explore-button" href="/html/itmes.html"
                >구경하러 가기</a
              >
            </div>
          </div>
          <img
            class="header-image"
            src="/image/header.svg"
            alt="판다가 장바구니를 들고 한 손으로 인사하는 이미지"
          />
        </div>
      </section>

      <!-- Main Body -->
      <section class="body-container">
        <section class="content-section">
          <div class="content-card">
            <img
              src="/image/hot.svg"
              alt="두 마리의 판다 뒤통수가 티셔츠를 바라보고 있는 이미지"
            />
            <div class="content-text">
              <span class="content-label">Hot item</span>
              <h2 class="content-title">
                <span>인기 상품을</span>
                확인해보세요
              </h2>
              <p class="content-description">
                가장 HOT한 중고거래 물품을<br />
                판다 마켓에서 확인해 보세요
              </p>
            </div>
          </div>
        </section>

        <section class="content-section">
          <div class="content-card">
            <img src="/image/search.svg" alt="돋보기 그림이 있는 이미지" />
            <div class="content-text">
              <span class="content-label">Search</span>
              <h2 class="content-title">
                <span>구매를 원하는</span>
                상품을 검색하세요
              </h2>
              <p class="content-description">
                구매하고 싶은 물품은 검색해서<br />
                쉽게 찾아보세요
              </p>
            </div>
          </div>
        </section>

        <section class="content-section">
          <div class="content-card">
            <img
              src="/image/register.svg"
              alt="파란색 폴더와 필기구, 책, 하트 모양 안경 아이콘이 포함된 일러스트 이미지"
            />
            <div class="content-text">
              <span class="content-label">Register</span>
              <h2 class="content-title">
                <span>판매를 원하는</span>
                상품을 등록하세요
              </h2>
              <p class="content-description">
                어떤 물건이든 판매하고 싶은 상품을<br />
                쉽게 등록하세요
              </p>
            </div>
          </div>
        </section>
      </section>

      <!-- Main Footer -->
      <section class="content-footer">
        <div class="content-footer-content">
          <h3 class="content-footer-text">
            믿을 수 있는<br />
            판다마켓 중고 거래
          </h3>
          <img
            class="content-footer-img"
            src="/image/footer.svg"
            alt="두 마리의 판다가 장보러 가면서 이야기를 나누는 이미지"
          />
