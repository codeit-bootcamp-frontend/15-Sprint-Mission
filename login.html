<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="loginpage">
    <div class="text-para">
     <img src="./images/logo.png" alt=loginimg class="loginimg">
     <form class="loginform">
      <!-- 이메일 적는 곳 시작-->
      <label class="emailform">
        이메일
        <input type="text" name="userEmail" placeholder="codeit@email.com" class="innertext">
      </label>
      <!-- 패스워드 적는 곳 시작-->
      <label class="pswdform">
        비밀번호
        <input type="text" name="userPassword" placeholder="password" class="innertext">
      </label>
      <button type="submit" class="login-btn">로그인</button>
     </form>
     <!-- 간편 로그인 칸-->
    <div class="easylogin">
      <span>간편 로그인 하기</span>
      <div class="el-icon">
        <a href="https://www.google.com">
          <img src="./images/Component 2.png">
        </a>
        <a href="https://www.kakaocorp.com/page">
          <img src="./images/Component 3.png">
        </a>
      </div>
    </div>
    <div class="signup">
      판마다켓이 처음이신가요?
      <a href="signup.html">회원가입</a>
    </div>
    </div> 
  </div>
  <script src="login.js"></script>
</body>
</html>
