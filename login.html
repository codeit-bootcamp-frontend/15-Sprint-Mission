<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="icon" href="/images/favicon.ico" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <title>로그인</title>
  </head>
  <body>
    <main>
      <a class="logo-box" href="/">
        <img class="logo" src="images/logo.png" />
        <img class="pandamarket" src="images/pandamarket.png" />
      </a>
      <form>
        <div class="login-input">
          <label for="email">이메일</label>
          <input type="email" id="email" placeholder="이메일을 입력해주세요" />
        </div>
        <div class="login-input">
          <label for="password">비밀번호</label>
          <div class="password-container">
            <input type="password" id="password" placeholder="비밀번호를 입력해주세요" />
            <button type="button">
              <img
              src="images/invisible-eye-icon.png"
              class="eye-icon"
              onclick="togglePasswordVisibility()"
              />
            </button>
          </div>
        </div>
        <button class="btn" type="submit">로그인</button> 
      </form>
      <div class="easy-login">
        <div class="easy-login-box">
          <p>간편 로그인하기</p>
          <div class="easy-login-icons">
            <a href="https://www.google.com/"><img src="images/google.png" width="40" height="40" /></a>
            <a href="https://www.kakaocorp.com/page/"><img src="images/kakao.png" width="40" height="40" /></a>
          </div>
        </div>
      </div>
      <p class="question">판다마켓이 처음이신가요?&nbsp;<a class="signup" href="/signup.html">회원가입</span></p>
    </main>
  </body>
</html>
