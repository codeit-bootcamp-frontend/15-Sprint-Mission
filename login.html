<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 로그인</title>
  </head>

  <body>
    <div>
      <div>
        <a href="/"><img src="images/logo/logo.png" alt="판다마켓 홈" width="396" /></a>
      </div>

      <form method="post">
        <div>
          <label for="email">이메일</label>
          <input name="email" type="email" placeholder="이메일을 입력해 주세요" />
        </div>
        <div>
          <label for="password">이메일</label>
          <div>
            <input name="password" type="password" placeholder="비밀번호를 입력해 주세요 " />
            <img src="images/login_icon/eye-invisible.svg" alt="비밀번호 감추기" />
          </div>
        </div>
        <button type="submit">로그인</button>
      </form>

      <div>
        <h3>간편 로그인하기</h3>
        <div>
          <a href="https://www.google.com/" target="_blank"
            ><img src="images/socialIcon/google-logo.png" alt="구글 로그인" width="42"
          /></a>
          <a href="https://www.kakaocorp.com/page/" target="_blank"
            ><img src="images/socialIcon/kakao-logo.png " alt="카카오톡 로그인" width="42"
          /></a>
        </div>
      </div>

      <div>
        판다마켓이 처음이신가요?
        <a href="signup.html">회원가입</a>
      </div>
    </div>
  </body>
</html>
