<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="icon-img/panda-face.png" />
    <title>로그인</title>
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="auth.css" />
    <script defer type="module" src="auth.js"></script>
  </head>
  <body>
    <div class="auth-container">
      <header>
        <a href="/index.html">
          <img
            class="header-logo"
            src="icon-img/loginLogo.svg"
            alt="판다마켓 로고"
          />
        </a>
      </header>
      <main>
        <form>
          <div class="email-page">
            <label for="email">이메일</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="이메일을 입력해주세요"
            />
            <div class="email-error-message"></div>
          </div>
          <div class="password-page">
            <label for="password">비밀번호</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="비밀번호를 입력해주세요"
            />
            <button class="password-eye-button" type="button">
              <img
                class="password-eye"
                src="icon-img/closed-eye.svg"
                alt="눈에 사선이 쳐진 아이콘"
              />
            </button>
            <div class="pw-error-message"></div>
          </div>
          <button class="auth-button" type="submit">로그인</button>
        </form>
        <div class="quick-login">
          <div class="sns-login-title">간편 로그인하기</div>
          <ul class="buttons">
            <li>
              <a href="https://www.google.com/">
                <img
                  class="button"
                  src="icon-img/google.svg"
                  alt="구글 아이콘"
                />
              </a>
            </li>
            <li>
              <a href="https://www.kakaocorp.com/page/">
                <img
                  class="button"
                  src="icon-img/kakao.svg"
                  alt="카카오 아이콘"
                />
              </a>
            </li>
          </ul>
        </div>
        <div class="auth-switch">
          판다마켓이 처음이신가요? <a href="signup.html">회원가입</a>
        </div>
      </main>
    </div>
  </body>
</html>
