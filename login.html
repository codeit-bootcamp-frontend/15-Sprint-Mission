<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/typography.css" />
    <link rel="stylesheet" href="css/utilities.css" />
    <link rel="stylesheet" href="css/buttons.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/auth-responsive.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <title>로그인 - 판다마켓</title>
  </head>
  <body>
    <div class="auth-container">
      <div class="logo-wrapper">
        <a href="/">
          <img src="public/logos/panda-market2x.png" alt="판다마켓 홈" />
        </a>
      </div>

      <form method="post" class="auth-form">
        <div class="input-item">
          <label for="email">이메일</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="이메일을 입력해 주세요"
          />
        </div>
        <div class="input-item">
          <label for="password">비밀번호</label>
          <div class="input-wrapper">
            <input
              id="password"
              name="password"
              type="password"
              placeholder="비밀번호를 입력해 주세요"
            />
            <button type="button" class="toggle-password">
              <img
                src="public/icons/ic_visibility_off.png"
                alt="비밀번호 숨김"
              />
            </button>
          </div>
        </div>

        <button type="submit" class="button pill-button full-width">
          로그인
        </button>
      </form>

      <div class="social-login-container">
        <h3>간편 로그인하기</h3>
        <div class="social-login-buttons">
          <a href="https://www.google.com/" target="_blank" class="social-btn">
            <img src="public/icons/ic_google.png" alt="구글 로그인" />
          </a>
          <a
            href="https://www.kakaocorp.com/page/"
            target="_blank"
            class="social-btn"
          >
            <img src="public/icons/ic_kakao.png" alt="카카오톡 로그인" />
          </a>
        </div>
      </div>

      <div class="auth-switch">
        판다마켓이 처음이신가요? <a href="signup.html">회원가입</a>
      </div>
    </div>
    <script src="scripts/validation.js"></script>
    <script src="scripts/login.js"></script>
  </body>
</html>
