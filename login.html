<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"/>
  <title>login</title>
  <link rel="stylesheet" href="css/loginSignUp.css">
  <link rel="icon" href="img/pandaLogoIcon.svg">
</head>
<body>
  <main>
    <a class="main-logo-contain" href="index.html">
      <img class="main-logo" src="img/pandaLogoIcon.svg" alt="판다마켓 로고">
      <img class="main-logo-text" src="img/padamaketText.svg" alt="판다마켓 로고 글자">
    </a>
    <form>
      <label class="input-label" for="username">
        이메일
      </label>
      <input class="input-field" id="username" name="username" type="email" placeholder="이메일을 입력해주세요">
      
      <label class="input-label" for="password" >
        비밀번호
      </label>
      <input class="input-field input-password" id="password" name="password" type="password" placeholder="비밀번호를 입력해주세요">

      <button type="submit" class="login-button">
        로그인
      </button>
    </form>
    <div class="easy-login">
      <div class="easy-text">
        간편 로그인하기
      </div>
        <div class="login-sites">
          <a href="https://www.google.com/">
            <img class="login-site" src="img/googleIcon.svg" alt="구글을 통한 로그인">
          </a>
          
          <a href=“https://www.kakaocorp.com”>
            <img class="login-site" src="img/kakaoIcon.svg" alt="카카오톡을 통한 로그인">
          </a>
        </div>
    </div>
    <div class="signup-text">
      판다마켓이 처음이신가요? <a class="signlink-text" href="SignUp.html">회원가입</a>
    </div>
  </main>
</body>
</html>
