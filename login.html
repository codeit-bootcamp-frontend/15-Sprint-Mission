<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>판다마켓-로그인</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.6/dist/web/static/pretendard.css"
    />
    <link rel="stylesheet" href="auth.css" />
    <link rel="stylesheet" href="global.css" />
  </head>
  <body>
    <div class="content">
      <div class="head-img">
        <a class="login-link" href="/">
          <img class="pandaMarketImg" src="img/logoHead.png" />
          <img class="pandaMarketImg-name" src="img/logoName.png" />
        </a>
      </div>
      <form action="/login" method="post">
        <div class="input-content">
          <label for="userName" class="userName-label">이메일</label>
          <input
            type="email"
            name="userName"
            id="userName"
            class="userName"
            placeholder="이메일을 입력해주세요"
          />
          <div id="error-message"></div>
          <label for="userPassword" class="userPassword-label">비밀번호</label>
          <input
            type="password"
            name="userPassword"
            id="userPassword"
            class="userPassword"
            placeholder="비밀번호를 입력해주세요"
          />
          <div id="error-password"></div>
        </div>
        <div class="content-login">
          <button type="submit" class="login-button" id="loginBtn" disabled>
            로그인
          </button>
        </div>
      </form>
      <div>
        <div class="blue-section">
          <p class="simpleLogin">간편 로그인하기</p>
          <ul class="social-links">
            <li>
              <a href="https://www.google.com/" target="_blank">
                <img class="social-icon" src="img/google.png" alt="google" />
              </a>
            </li>
            <li>
              <a href="https://www.kakaocorp.com/page/" target="_blank">
                <img class="social-icon" src="img/kakao.png" alt="kakao" />
              </a>
            </li>
          </ul>
        </div>
      </div>
      <div class="foot-content">
        <p class="advice">판다마켓은 처음이신가요?</p>
        <a class="membership" href="signup.html">회원가입</a>
      </div>
    </div>
    <script src="login.js"></script>
  </body>
</html>
