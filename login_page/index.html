<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login_page</title>
    <link rel="stylesheet" href="/reset.css"/>
    <link rel="stylesheet" href="/login_page/style.css" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <a class="panda_logo" a href="/index.html"><img src="/login_page/login_image/logo.png"></a>
        <div class="input_sector">
            <div class="email_sector">
                <span>이메일</span>
                <div class="inputbox">
                    <input type="email" placeholder="codeit@email.com" >
                </div>
            </div>
            <div class="pw_sector">
                <span>비밀번호</span>
                <div class="inputbox">
                    <input type="password" placeholder="">
                    <div class="eye">
                        <i class="fas fa-eye"></i>
                    </div>
            </div>
        </div>
        <div class="login_btn">로그인</div>
        <div class="easy_login">
            <strong>간편 로그인하기</strong>
            <div>
                <a class="google_icon" href="http://www.google.com/"><img src="/login_page/login_image/google_icon.png"></a>
                <a href="https://www.kakaocorp.com/page/"><img src="/login_page/login_image/kakao_icon.png"></a>
            </div>
        </div>
        <div class="new_signup">
            <p>판다마켓이 처음이신가요? <a href="/signup_page/">회원가입</a></p>
        </div>
    </div>
</body>
</html>
