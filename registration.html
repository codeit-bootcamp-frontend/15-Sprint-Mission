<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 - 로그인</title>
    <link rel="icon" href="images/logo/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="Style/registration.css" />
  </head>

  <body>
    <form>
      <h1>
        <a href="index.html">
          <img id="login" src="images/logo/panda-market-logo.png" alt="pandalogin">
        </a>
      </h1>
      <div class="container">
        <label class="emailpass">이메일</label>
        <input
          name="email"
          type="email"
          placeholder="codeit@email.com"
        />  
      </div>
      <div class="container">
        <label class="emailpass">닉네임</label>
        <input
          name="username"
          type="username"
          placeholder="닉네임"
        />  
      </div>
      <div class="container">
        <label class="emailpass">비밀번호</label>
        <input
          name="password"
          type="password"
          placeholder="비밀번호"
        />  
      </div>
      <div class="container">
        <label class="emailpass">비밀번호 확인</label>
        <input
          name="password"
          type="password"
          placeholder="비밀번호 확인"
        />  
      </div>
      <div class="container">
        <button id="loginb">로그인</button>
      </div>
      
      <div class="container">
        <div id="easylogin">
          <p>간편 로그인하기</p>
          <div>
            <a href="https://www.google.co.kr/">
              <img class="imgsns" src="images/login/google-logo.png" alt="google">
            </a>
            <a href="https://www.kakaocorp.com/page/">
              <img class="imgsns" src="images/login/kakao-logo.png" alt="kakao">
            </a>
          </div>  
        </div>
      </div>
      <div id="memberq">
        이미 회원이신가요?
        <a id="join" href="login.html">로그인</a>
      </div>
    </form>
  </body>
</html>
