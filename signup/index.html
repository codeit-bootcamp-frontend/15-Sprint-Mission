<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="판다마켓" />
    <meta property="og:description" content="일상의 모든 물건을 거래해보세요" />
    <meta
      property="og:image"
      content="https://velog.velcdn.com/images/justhighway/post/5420692e-7361-4bd8-a395-01a1e8a5f4fa/image.jpg"
    />
    <meta property="og:url" content="popo-sprint3.netlify.com" />
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="index.css" />
    <title>판다마켓</title>
    <script
      src="https://kit.fontawesome.com/0f08ea7d4a.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <a href="/" class="login-header">
        <a href="/" class="login-header">
          <img
            src="/assets/logos/login-logo-x1.svg"
            alt="판다마켓 로고"
            id="logo"
          />
        </a>
      </a>
    </header>
    <main class="login-main">
      <form action="" method="post" class="login-form">
        <label for="email">이메일</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="이메일을 입력해주세요"
          class="login-input"
        />
        <label for="nickname">닉네임</label>
        <input
          type="text"
          id="nickname"
          name="nickname"
          placeholder="닉네임을을 입력해주세요"
          class="login-input"
        />
        <label for="password">비밀번호</label>
        <div class="password-container">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="비밀번호를 입력해주세요"
            class="login-input"
          />
          <button type="button" class="password-toggle-icon">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
        <label for="password-confirm">비밀번호</label>
        <div class="password-container">
          <input
            type="password"
            id="password"
            name="password-confirm"
            placeholder="비밀번호를 다시 한 번 입력해주세요"
            class="login-input"
          />
          <button type="button" class="password-toggle-icon">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
        <button class="login-btn">로그인</button>
      </form>
      <section class="login-social">
        <span>간편 로그인하기</span>
        <div class="social-icons">
          <a href="https://www.google.com" class="social-icon"
            ><img
              src="/assets/icons/login-google-icon.webp"
              alt="구글 로그인 이미지"
              class="social-icon-img" /></a
          ><a href="https://www.kakao.com" class="social-icon"
            ><img
              src="/assets/icons/login-kakao-icon.webp"
              alt="카카오 로그인 이미지"
              class="social-icon-img"
          /></a>
        </div>
      </section>
      <div class="login-sign-up">
        이미 회원이신가요?
        <a href="/login/" class="sign-up-link"> 로그인 </a>
      </div>
    </main>
  </body>
</html>
